<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><title>انتقال کاربران به Firebase Auth</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<style>body{font-family:Tahoma,sans-serif;max-width:820px;margin:24px auto;padding:0 14px;line-height:2}
button{padding:8px 16px;margin:4px;font-family:inherit}pre{background:#0f172a;color:#e2e8f0;padding:12px;border-radius:8px;white-space:pre-wrap;direction:ltr;text-align:left;min-height:120px}
.w{background:#fef3c7;border:1px solid #fcd34d;padding:10px;border-radius:8px}input{width:100%;direction:ltr;padding:6px}</style></head><body>
<h2>انتقال کاربران به Firebase Authentication</h2>
<div class="w"><b>این ابزار را فقط یک‌بار و <u>قبل از</u> انتشار قوانین جدید اجرا کنید.</b>
برای هر کاربر دارای نام‌کاربری، یک حساب Auth می‌سازد (با همان رمز فعلی)، نقش او را در <code>roles</code> ثبت می‌کند و رمز هش‌شده را از <code>personnel</code> حذف می‌کند.</div>
<p>Web API Key: <input id="k" value="AIzaSyDjc0YZJye8Y8opAOdRWFwKS9Ica0M3h_s"></p>
<button onclick="run(true)">۱) پیش‌نمایش (بدون تغییر)</button>
<button onclick="run(false)">۲) اجرای انتقال</button>
<pre id="o">آماده...</pre>
<script>
const cfg={apiKey:'',authDomain:'hseta-58036.firebaseapp.com',projectId:'hseta-58036',databaseURL:'https://hseta-58036-default-rtdb.firebaseio.com/'};
function _sha256Hex(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const bytes=[...unescape(encodeURIComponent(str))].map(c=>c.charCodeAt(0));
  const bitLen=bytes.length*8;
  bytes.push(0x80); while(bytes.length%64!==56) bytes.push(0);
  for(let i=7;i>=0;i--) bytes.push(i>3?0:(bitLen>>>(i*8))&0xff);
  const rotr=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let off=0;off<bytes.length;off+=64){
    const W=new Array(64);
    for(let i=0;i<16;i++) W[i]=(bytes[off+i*4]<<24)|(bytes[off+i*4+1]<<16)|(bytes[off+i*4+2]<<8)|bytes[off+i*4+3];
    for(let i=16;i<64;i++){
      const s0=rotr(W[i-15],7)^rotr(W[i-15],18)^(W[i-15]>>>3);
      const s1=rotr(W[i-2],17)^rotr(W[i-2],19)^(W[i-2]>>>10);
      W[i]=(W[i-16]+s0+W[i-7]+s1)|0;
    }
    let [a,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){
      const S1=rotr(e,6)^rotr(e,11)^rotr(e,25);
      const ch=(e&f)^(~e&g);
      const t1=(h+S1+ch+K[i]+W[i])|0;
      const S0=rotr(a,2)^rotr(a,13)^rotr(a,22);
      const mj=(a&b)^(a&c)^(b&c);
      const t2=(S0+mj)|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    H=[(H[0]+a)|0,(H[1]+b)|0,(H[2]+c)|0,(H[3]+d)|0,(H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+h)|0];
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
function hashPw(username, pw){ return _sha256Hex(String(username||'').toLowerCase()+':'+String(pw||'')); }
function isHashedPw(v){ return /^[0-9a-f]{64}$/.test(String(v||'')); }
function hashPw(u,pw){return _sha256Hex(String(u||'').toLowerCase()+':'+String(pw||''))}
function isHashedPw(v){return /^[0-9a-f]{64}$/.test(String(v||''))}
const AUTH_MAIL_DOMAIN='hse-tanbour.app';
function authKey(u){return String(u||'').trim().toLowerCase().replace(/[^a-z0-9._-]/g,function(c){return '_x'+c.charCodeAt(0).toString(16)+'_'})}
function authEmail(u,gen){return authKey(u)+(gen>0?'+g'+gen:'')+'@'+AUTH_MAIL_DOMAIN}
const out=m=>{document.getElementById('o').textContent+='\n'+m};
async function run(dry){
  const key=document.getElementById('k').value.trim(); if(!key){alert('apiKey را وارد کنید');return}
  cfg.apiKey=key; document.getElementById('o').textContent=dry?'--- پیش‌نمایش ---':'--- اجرا ---';
  try{
    out('نشانی صفحه: '+location.protocol+'//'+(location.host||'(فایل محلی)'));
    if(!/^https?:$/.test(location.protocol)){out('⚠ این صفحه از فایل محلی باز شده؛ ساخت حساب کار نمی‌کند. آن را روی همان آدرس https سامانه آپلود و از آنجا باز کنید.');return}
    if(!firebase.apps.length)firebase.initializeApp(cfg);
    const auth=firebase.auth(), root=firebase.database().ref();
    out('در حال اتصال به دیتابیس...');
    const snap=await Promise.race([
      root.child('hse_data/personnel').once('value'),
      new Promise((_,rej)=>setTimeout(()=>rej({message:'پس از ۲۰ ثانیه پاسخی نیامد؛ اینترنت/فیلترشکن را بررسی کنید'}),20000))
    ]);
    out('داده‌ها خوانده شد.');
    const val=snap.val()||{}; const upd={}; let ok=0,skip=0;
    for(const k of Object.keys(val)){
      const r=val[k]; if(!r||!r.u){skip++;continue}
      if(r.uid){out('قبلاً منتقل شده: '+r.u);skip++;continue}
      if(!r.p){out('⚠ بدون رمز، رد شد: '+r.u);skip++;continue}
      const pass=isHashedPw(r.p)?r.p:hashPw(r.u,r.p), email=authEmail(r.u,0);
      if(dry){out('ساخته می‌شود: '+r.u+' ('+r.role+')');ok++;continue}
      let uid=null;
      try{uid=(await auth.createUserWithEmailAndPassword(email,pass)).user.uid}
      catch(e){
        if(e.code==='auth/email-already-in-use'){
          try{uid=(await auth.signInWithEmailAndPassword(email,pass)).user.uid;out('حساب موجود بود: '+r.u)}
          catch(e2){out('✖ حساب موجود با رمز دیگر: '+r.u);skip++;continue}
        }else{out('✖ '+r.u+': '+e.code);skip++;continue}
      }
      upd['roles/'+uid]={role:r.role||'worker'};
      upd['hse_data/personnel/'+k+'/uid']=uid;
      upd['hse_data/personnel/'+k+'/pg']=0;
      upd['hse_data/personnel/'+k+'/p']=null;
      out('✔ '+r.u+' → '+uid);ok++;
    }
    if(!dry&&Object.keys(upd).length){await root.update(upd);out('\nتغییرات در دیتابیس ثبت شد.')}
    out('\nموفق: '+ok+' | ردشده: '+skip);
    if(!dry)out('گام بعد: قوانین جدید (firebase-rules.json) را Publish کنید.');
  }catch(e){out('خطا: '+(e.code||e.message))}
}
</script></body></html>
