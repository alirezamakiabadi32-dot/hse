/* ---- شمارنده‌ی «موارد جدید» در هر ماژول ----
   هر رکورد با شناسه و وضعیتش امضا می‌شود. رکوردی که امضایش قبلاً دیده نشده
   (رکورد تازه، یا تغییر وضعیت) به‌عنوان مورد جدید شمرده می‌شود.
   با باز کردن ماژول، همه‌ی موارد آن ماژول دیده‌شده ثبت می‌شوند. */
const SEEN_KEY = 'hse_seen_v1_';
let _seenStore = null;
function seenLoad(){
  if(_seenStore) return _seenStore;
  try{ _seenStore = JSON.parse(localStorage.getItem(SEEN_KEY + (me ? me.name : '')) || '{}') || {}; }
  catch(e){ _seenStore = {}; }
  return _seenStore;
}
function seenSave(){
  try{ localStorage.setItem(SEEN_KEY + (me ? me.name : ''), JSON.stringify(_seenStore || {})); }catch(e){}
}
function recSig(r){ return String(r.id) + '|' + String(r.status || ''); }
function moduleRecs(k){ return (db && Array.isArray(db[k])) ? db[k] : null; }
function markModuleSeen(k){
  const recs = moduleRecs(k); if(!recs || !me) return;
  seenLoad(); _seenStore[k] = recs.map(recSig); seenSave();
}
function newItemCount(k){
  const recs = moduleRecs(k); if(!recs || !me) return 0;
  const st = seenLoad();
  if(!Array.isArray(st[k])){ st[k] = recs.map(recSig); seenSave(); return 0; }
  const seen = new Set(st[k]);
  return recs.filter(r => !seen.has(recSig(r)) && r.createdBy !== me.name).length;
}

/* ---- تاریخ بازرسی بعدی بر اساس دوره‌ی تعریف‌شده (روز) ---- */
function jAddDays(s,n){
  const g=jParse(s); if(!g) return '';
  const d=new Date(g.gy,g.gm-1,g.gd+Number(n||0));
  const j=g2j(d.getFullYear(),d.getMonth()+1,d.getDate());
  return j.jy+'/'+p2(j.jm)+'/'+p2(j.jd);
}
/* همه‌ی بازرسی‌های زمان‌بندی‌شده: چک‌لیست‌های عمومی + تجهیزات اضطراری
   left = روز باقی‌مانده تا بازرسی بعدی (صفر یا منفی یعنی سررسید رسیده) */
function inspDueList(includeNever){
  const out=[];
  if(!db) return out;
  Object.keys(TPLS||{}).forEach(tk=>{
    if(EMG_TPLS[tk]) return;
    const per=+((TPLS[tk]||{}).period)||0; if(!per) return;
    const last=(db.inspections||[]).filter(apprOK).filter(r=>r.tpl===tk).sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0];
    if(!last){ if(includeNever) out.push({kind:'tpl',id:tk,label:TPLS[tk].t,last:'',next:'',left:null}); return; }
    const next=jAddDays(last.date,per); const left=-jDaysAgo(next);
    if(isFinite(left)) out.push({kind:'tpl',id:tk,label:TPLS[tk].t,last:last.date,next:next,left:left});
  });
  (db.emgEquip||[]).forEach(r=>{
    if(!emgTplKey(r.item)) return;
    const lbl=r.item+' — '+(r.loc||'—');
    const st=emgInspState(r);
    if(st.left===null){ if(includeNever) out.push({kind:'eq',id:r.id,label:lbl,last:'',next:'',left:null}); return; }
    if(!isFinite(st.left)) return;
    out.push({kind:'eq',id:r.id,label:lbl,last:st.last?st.last.date:st.manual,next:st.next,left:st.left,never:!st.last});
  });
  return out;
}
function dueChip(left){
  if(left===null) return '<span class="chip b-mut">بدون بازرسی</span>';
  if(left<0) return '<span class="chip b-bad">'+nd(-left)+' روز معوق</span>';
  if(left===0) return '<span class="chip b-warn">امروز سررسید است</span>';
  return '<span class="chip b-ok">'+nd(left)+' روز مانده</span>';
}
/* جدول بازرسی‌های بعدی بالای فهرست ماژول‌های بازرسی و تجهیزات اضطراری */
function dueBoard(k){
  const kind=k==='emgEquip'?'eq':'tpl';
  const rows=inspDueList(true).filter(x=>x.kind===kind).sort((a,b)=>{
    if(a.left===null) return 1; if(b.left===null) return -1; return a.left-b.left;});
  let h='';
  if(rows.length){
    h+='<div class="card"><div class="sechead">📅 بازرسی‌های بعدی</div>'
      +(kind==='eq'?'<div style="font-size:12px;color:var(--mut);margin-bottom:8px">آخرین و بعدیِ بازرسی و وضعیت هر تجهیز از روی چک‌لیست‌های ثبت‌شده محاسبه می‌شود. چک‌لیست «منتظر تایید» هم حساب می‌شود؛ چک‌لیست ردشده نه.</div>':'')
      +'<div class="tscroll"><table class="tbl"><thead><tr><th>مورد</th><th>آخرین بازرسی</th><th>بازرسی بعدی</th><th>وضعیت</th></tr></thead><tbody>'
      + rows.map(x=>'<tr><td>'+esc(x.label)+'</td><td>'+(x.last?esc(x.last):'—')+'</td><td>'+(x.next?esc(x.next):'—')+'</td><td>'+(x.never&&!x.last?'<span class="chip b-bad">هنوز بازرسی نشده</span>':dueChip(x.left))+'</td></tr>').join('')
      + '</tbody></table></div></div>';
  }
  if(kind==='eq') h+=emgOrphanBox();
  return h;
}
function dueNextCell(tk){
  const last=(db.inspections||[]).filter(apprOK).filter(r=>r.tpl===tk).sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0];
  if(!last) return '<span class="chip b-mut">هنوز بازرسی نشده</span>';
  const next=jAddDays(last.date,(TPLS[tk]||{}).period); const left=-jDaysAgo(next);
  return esc(next)+' '+dueChip(isFinite(left)?left:null);
}

/* نشان اولویت اعلان: فوری = قرمز، مهم = نارنجی، عادی = آبی روشن */
function annChip(p){return chip(p||'عادی',({'فوری':'b-bad','مهم':'b-warn'})[p]||'b-info')}
/* ---- سلسله‌ی تایید: پرسنل اجرایی ← کارشناس ایمنی ← مدیریت ----
   ثبت پرسنل اجرایی: اول کارشناس، بعد مدیریت
   ثبت کارشناس ایمنی: فقط مدیریت
   ثبت مدیریت: بدون نیاز به تایید */
const ROLE_FA={worker:'پرسنل اجرایی',expert:'کارشناس ایمنی',manager:'مدیریت'};
const APPR_EXCLUDE=['personnel','areas','ptw','scoreArch'];
const APPR_MODS=RECORD_MODS.filter(k=>APPR_EXCLUDE.indexOf(k)<0);
function roleName(r){ return ROLE_FA[r]||r; }
function roleOfName(n){ const p=(db&&db.personnel||[]).find(x=>x.name===n); return p?p.role:'worker'; }
function apprInit(role){
  if(role==='worker') return {stage:'expert',hist:[]};
  if(role==='expert') return {stage:'manager',hist:[]};
  return {stage:'approved',hist:[]};
}
function apprOK(r){ return !r.appr || r.appr.stage==='approved'; }
function apprCanAct(r){
  return !!r.appr && ((r.appr.stage==='expert'&&me.role==='expert')||(r.appr.stage==='manager'&&me.role==='manager'));
}
function apprLabel(a){
  return a.stage==='expert'?'ثبت اولیه — منتظر تایید کارشناس ایمنی':a.stage==='manager'?'ثبت اولیه — منتظر تایید مدیریت':a.stage==='rejected'?'برگشت داده شده به ثبت‌کننده':'ثبت نهایی';
}
/* نشان وضعیت تایید در فهرست: فقط موارد در انتظار و ردشده */
function apprChip(r){
  if(!r.appr || r.appr.stage==='approved') return '';
  const cl=r.appr.stage==='rejected'?'b-bad':'b-warn';
  return '<span class="chip '+cl+'">'+apprLabel(r.appr)+'</span> ';
}
/* تعداد مواردی که منتظر تایید نقش فعلی هستند (برای منوی کناری) */
function apprPending(k){
  if(!me||!APPR_MODS.includes(k)||!Array.isArray(db[k])) return 0;
  const st=me.role==='expert'?'expert':me.role==='manager'?'manager':null;
  if(!st) return 0;
  return db[k].filter(r=>r.appr&&r.appr.stage===st).length;
}
function apprBoxHTML(k,r){
  if(!APPR_MODS.includes(k)||!r.appr) return '';
  const a=r.appr;
  let h='<div class="card" style="margin-top:12px;background:var(--surf)"><div class="sechead">✍️ مسیر تایید — '+apprLabel(a)+'</div>';
  if((a.hist||[]).length){
    h+=(a.hist||[]).map(x=>'<div class="emgrow"><span>'+esc(x.n)+' ('+roleName(x.r)+')</span><span>'+(x.a==='approve'?'✔ تایید':'✖ رد')+' — '+esc(x.d)+(x.reason?' — '+esc(x.reason):'')+'</span></div>').join('');
  }
  if(apprCanAct(r)){
    h+='<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri sm" onclick="apprAct(\''+k+'\',\''+r.id+'\',\'approve\')">✅ تایید</button><button class="btn danger sm" onclick="apprAct(\''+k+'\',\''+r.id+'\',\'reject\')">✖ رد با ذکر دلیل</button></div>';
  } else if(a.stage==='rejected'){
    h+='<div style="margin-top:8px;font-size:12px;color:var(--mut)">'+(r.createdBy===me.name?'برای ارسال مجدد، فرم را ویرایش و ذخیره کنید.':'منتظر اصلاح و ارسال مجدد توسط ثبت‌کننده است.')+'</div>';
  } else if(a.stage!=='approved'){
    h+='<div style="margin-top:8px;font-size:12px;color:var(--mut)">در انتظار اقدام '+roleName(a.stage)+'</div>';
  }
  return h+'</div>';
}
/* تایید یا رد یک مرحله توسط نقش مربوط */
function apprAct(k,id,action){
  const r=(db[k]||[]).find(x=>x.id===id);
  if(!r||!r.appr){ toast('مورد یافت نشد'); return; }
  if(!apprCanAct(r)){ toast('این مرحله‌ی تایید مربوط به نقش شما نیست'); return; }
  let reason='';
  if(action==='reject'){
    reason=(prompt('دلیل رد را بنویسید:')||'').trim();
    if(!reason){ toast('برای رد کردن، ذکر دلیل الزامی است'); return; }
  }
  const a=r.appr; a.hist=a.hist||[];
  a.hist.push({r:me.role,n:me.name,d:todayJ(),a:action==='approve'?'approve':'reject',reason:reason});
  if(action==='reject'){ a.stage='rejected'; a.reason=reason; }
  else a.stage=(a.stage==='expert')?'manager':'approved';
  r.log=(r.log||[]).concat([{u:me.name,d:todayJ(),t:(action==='approve'?'تایید':'رد')+' ('+roleName(me.role)+')'+(reason?': '+reason:'')}]);
  queueRec(k,id); save();
  if(k==='inspections') syncEmgEquip(emgEqIdOfInsp(r));
   toast(action==='approve'?'✔ تایید شد':'✖ رد شد');
  renderSidebar();
  openDetail(k,id);
  if(curPage===k) renderRows();
}
function recLabel(r){
  return String(r.title||r.desc||r.item||r.topic||r.task||r.course||r.equip||r.type||r.code||r.id).slice(0,60);
}

/* ---------- خوانده‌شدن اعلان‌ها (ذخیره برای هر کاربر در مرورگر) ---------- */
const READ_KEY='hse_notif_read_';
function notifKey(n){return [n.kind,n.id||'',n.text].join('|')}
function readSet(){try{return JSON.parse(localStorage.getItem(READ_KEY+(me?me.name:''))||'[]')||[]}catch(e){return []}}
function saveReadSet(a){try{localStorage.setItem(READ_KEY+(me?me.name:''),JSON.stringify(a.slice(-500)))}catch(e){}}
function markNotifRead(i,ev){
 if(ev)ev.stopPropagation();
 const n=(window._notifs||[])[i];if(!n)return;
 const a=readSet();const k=notifKey(n);if(!a.includes(k))a.push(k);
 saveReadSet(a);renderBell();
}
function markAllNotifsRead(ev){
 if(ev)ev.stopPropagation();
 const a=readSet();(window._notifs||[]).forEach(n=>{const k=notifKey(n);if(!a.includes(k))a.push(k)});
 saveReadSet(a);renderBell();
}

function renderBell(){
 const items=notifications();
 const badge=$('#belln');
 if(badge){if(items.length){badge.textContent=nd(items.length);badge.classList.remove('hidden')}else badge.classList.add('hidden')}
 const pop=$('#bellpop');if(!pop)return;
 if(!items.length){pop.innerHTML='<div class="bell-empty">✅ اعلان جدیدی ندارید</div>';window._notifs=[];return}
 pop.innerHTML='<div class="bell-head">🔔 اعلان‌ها <span class="chip b-mut">'+nd(items.length)+' مورد</span><button class="bell-all" onclick="markAllNotifsRead(event)">همه خوانده شد</button><button class="ibtn" onclick="closeBell()">✖</button></div>'
  +'<div class="bell-list">'+items.map((n,i)=>'<div class="bell-item" onclick="gotoNotif('+i+')">'
   +'<span class="bell-ic">'+n.icon+'</span>'
   +'<div class="bell-txt"><b>'+esc(n.text)+'</b><small>'+esc(n.sub||'')+'</small></div>'
   +'<span class="chip '+n.chip+'">'+esc(n.label)+'</span>'
   +'<button class="bell-read" title="خوانده شد" aria-label="خوانده شد" onclick="markNotifRead('+i+',event)">✓</button>'
   +'</div>').join('')+'</div>';
 window._notifs=items;
}
function toggleBell(e){if(e)e.stopPropagation();const pop=$('#bellpop');if(!pop)return;renderBell();pop.classList.toggle('hidden');}
function closeBell(){const p=$('#bellpop');if(p)p.classList.add('hidden')}
function gotoNotif(i){
 const n=(window._notifs||[])[i];if(!n){closeBell();return}
 closeBell();
 if(n.id){openDetail(n.kind,n.id)}else{setPage(n.kind)}
}
document.addEventListener('click',function(e){
 const p=$('#bellpop');
 if(p&&!p.classList.contains('hidden')&&!e.target.closest('.bellwrap'))p.classList.add('hidden');
});

function emgTplKey(item){
  const t = String(item||'');
  if(t.indexOf('پودر')>=0) return 'emg_powder';
  if(t.indexOf('CO2')>=0) return 'emg_co2';
  if(t.indexOf('شارژر')>=0) return 'emg_charger';
  if(t.indexOf('دوش')>=0) return 'emg_shower';
  if(t.indexOf('چشم')>=0) return 'emg_eyewash';
  if(t.indexOf('کمک')>=0) return 'emg_firstaid';
  if(t.indexOf('برانکارد')>=0) return 'emg_stretcher';
  if(t.indexOf('پتو')>=0) return 'emg_blanket';
  return null;
}
/* اطمینان از وجود چک‌لیست تجهیز در داده‌های برنامه (برای همه کاربران) */
function ensureEmgTpl(key){
  if(!key || !EMG_TPLS[key]) return false;
  if(typeof TPLS==='undefined' || !TPLS) return false;
  if(!TPLS[key]) TPLS[key] = JSON.parse(JSON.stringify(EMG_TPLS[key]));
  return true;
}
/* ---- منطق به‌روزرسانی لیست تجهیزات اضطراری از روی چک‌لیست‌های ثبت‌شده ----
   ثبت «منتظر تایید» هم در زمان‌بندی حساب می‌شود تا لیست تجهیزات همان لحظهٔ ثبت چک‌لیست به‌روز شود؛
   چک‌لیست ردشده هرگز حساب نمی‌شود. برای حساب‌کردن فقط تاییدشده‌ها این مقدار را false کنید. */
const EMG_COUNT_PENDING = true;
function emgInspCounts(i){
  if(!i.appr || i.appr.stage==='approved') return true;
  return EMG_COUNT_PENDING && i.appr.stage!=='rejected';
}
/* شناسه‌ی تجهیز یک بازرسی: eqId، یا کد داخل توضیحات (بازرسی‌های قدیمی) */
function emgEqIdOfInsp(i){
  if(!i) return '';
  if(i.eqId) return i.eqId;
  const m=/\(کد ([^)\s]+)\)/.exec(String(i.note||''));
  return m?m[1]:'';
}
function eqLabelById(id){
  const r=(db&&db.emgEquip||[]).find(x=>x.id===id);
  return r?(r.item+' — '+(r.loc||'—')):String(id||'');
}
/* آخرین بازرسی یک تجهیز اضطراری (با شناسه‌ی تجهیز؛ بازرسی‌های قدیمی‌تر با کد داخل توضیحات) */
function emgLastInsp(r){
  const key=emgTplKey(r.item); if(!key) return null;
  let best=null, bi=-1;
  (db.inspections||[]).forEach((i,ix)=>{
    if(!emgInspCounts(i)) return;
    if(emgEqIdOfInsp(i)!==r.id) return;
    if(!i.eqId && i.tpl!==key) return;
    const d=String(i.date||''), bd=best?String(best.date||''):'';
    if(!best || d>bd || (d===bd && ix>bi)){ best=i; bi=ix; }
  });
  return best;
}
function emgPeriodDays(r){
  const key=emgTplKey(r.item); if(!key) return 30;
  const t=(TPLS&&TPLS[key])||EMG_TPLS[key]||{};
  return +t.period||30;
}
/* وضعیت زمان‌بندی بازرسی یک تجهیز: آخرین بازرسی، موعد بعدی، روز باقی‌مانده، منتظر تایید بودن و تعداد مغایرت
   اگر هنوز چک‌لیستی ثبت نشده: مبنا = «آخرین بازرسی» دستی (اگر پر شده)، وگرنه بدون مهلت و فوری */
function emgInspState(r){
  const per=emgPeriodDays(r), last=emgLastInsp(r);
  if(last){
    const next=jAddDays(last.date,per);
    return {last:last,per:per,next:next,left:-jDaysAgo(next),pending:!!(last.appr&&last.appr.stage!=='approved'),fails:(last.fails||[]).length};
  }
  const manual=jParse(r.lastChk)?r.lastChk:'';
  /* بدون چک‌لیست و بدون «آخرین بازرسی» دستی: مهلتی وجود ندارد؛ همین حالا باید بازرسی شود */
  if(!manual) return {last:null,per:per,next:'',left:0,never:true,manual:''};
  const next=jAddDays(manual,per);
  return {last:null,per:per,next:next,left:-jDaysAgo(next),never:true,manual:manual};
}
/* مقادیر «آخرین بازرسی / بازرسی بعدی / وضعیت» که از آخرین چک‌لیست به دست می‌آید (null = چک‌لیستی ثبت نشده)
   وضعیت «خارج از سرویس» دستی است و هرگز خودکار تغییر نمی‌کند */
function emgDerivedFields(r){
  const last=emgLastInsp(r); if(!last) return null;
  const out={lastChk:last.date,nextChk:jAddDays(last.date,emgPeriodDays(r))};
  const S=(typeof L==='function'&&L('EMG_STATUS'))||[];
  const ST_OK=S[0]||'سالم', ST_SVC=S[1]||'نیازمند سرویس', ST_OUT=S[2]||'خارج از سرویس';
  if(r.status!==ST_OUT){
    if((last.fails||[]).length) out.status=ST_SVC;
    else if(!r.status || r.status===ST_SVC) out.status=ST_OK;
  }
  return out;
}
/* نوشتن مقادیر محاسبه‌شده روی رکورد تجهیز (فقط اگر تغییر کرده باشد)؛ eqId خالی = همهٔ تجهیزات */
function syncEmgEquip(eqId){
  try{
    if(!db||!Array.isArray(db.emgEquip)||window._viewOnly) return 0;
    let n=0;
    db.emgEquip.forEach(r=>{
      if(eqId && r.id!==eqId) return;
      if(!emgTplKey(r.item)) return;
      const d=emgDerivedFields(r); if(!d) return;
      let ch=false;
      Object.keys(d).forEach(k=>{ if(r[k]!==d[k]){ r[k]=d[k]; ch=true; } });
      if(ch){ queueRec('emgEquip',r.id); n++; }
    });
    if(n) save();
    return n;
  }catch(e){ console.warn('همگام‌سازی تجهیزات اضطراری:',e); return 0; }
}
function emgSyncAllUI(){
  const n=syncEmgEquip();
  toast(n?('✔ '+nd(n)+' تجهیز از روی چک‌لیست‌ها به‌روز شد'):'همهٔ تجهیزات از قبل به‌روز بودند');

/* نشان وضعیت بازرسی این دوره، کنار هر تجهیز در فهرست */
function emgInspChip(r){
  if(!emgTplKey(r.item)) return '';
  const s=emgInspState(r);
  if(!s.last){
    if(s.left!==null && isFinite(s.left) && s.left<=0) return '<span class="chip b-bad" title="هنوز چک‌لیستی برای این تجهیز ثبت نشده">هنوز بازرسی نشده</span> ';

function openEmgInspection(eqId){
  const r = db.emgEquip.find(x=>x.id===eqId);
  if(!r){ toast('تجهیز یافت نشد'); return; }

/* موارد نیازمند اقدام در ارزیابی 5S: همه اقلامی که نمره‌شان از این حد کمتر است (از همه ارکان) */
const S5_PROBLEM_MAX = 2;   /* 0 تا 2 = اجرا نشده / شروع شده / ناقص */
function s5ProblemItems(rec){
  const out=[];
  if(!rec || !rec.s5) return out;
  s5Keys().forEach(k=>{
    const t=s5Tpl()[k], items=s5ItemsOf(k), vals=rec.s5[k]||{};
    items.forEach((it,i)=>{
      const v=vals[i];
      if(v==='na') return;
      const sc = (v===undefined||v===null||v==='') ? 0 : (+v||0);
      if(sc<=S5_PROBLEM_MAX) out.push({key:k, num:t.num, rukn:t.name, idx:i, text:it, score:sc});
    });
  });
  return out;
}
/* نمایش همه موارد ضعیف و انتخاب آن‌ها برای اقدام اصلاحی */
function capaFromS5(id){
  const r=db.s5.find(x=>x.id===id); if(!r)return;
  const items=s5ProblemItems(r);
  if(!items.length){toast('موردی برای اقدام یافت نشد');return}
  const sc=s5ScoreOf(r);
  const optTxt=L('S5_SCORE_OPTS')||[];
  let h='<div style="font-size:12.5px;color:var(--mut);margin-bottom:10px">'

function initSignPads(){
  document.querySelectorAll('canvas.sign-pad').forEach(cv=>{
    const ctx=cv.getContext('2d');
    ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0f172a';
    cv.style.touchAction='none'; if(cv.dataset.drawn===undefined) cv.dataset.drawn='';
    let down=false,last=null;
    const pos=e=>{const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
    cv.onpointerdown=e=>{down=true;last=pos(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()};
    cv.onpointermove=e=>{if(!down)return;const q=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(q.x,q.y);ctx.stroke();last=q;cv.dataset.drawn='1'};
    const up=()=>{down=false;last=null};
    cv.onpointerup=up; cv.onpointercancel=up;
  });
}
function sigClear(role){
  const cv=document.querySelector('canvas.sign-pad[data-role="'+role+'"]'); if(!cv) return;
  cv.getContext('2d').clearRect(0,0,cv.width,cv.height); cv.dataset.drawn='';
}

  const cv=document.querySelector('canvas.sign-pad[data-role="'+me.role+'"]');

  rec.signs=Object.assign({},rec.signs||{});
  rec.signs[me.role]={name:me.name,job:myJob(),date:todayJ(),img:cv.toDataURL('image/png')};
}

 const lab=months.map(k=>MN[+k.slice(5,7)-1]);

 function grid(mx){let g='';for(let k=0;k<=4;k++){const yv=pt+(H-pt-pb)*(1-k/4);g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+yv+'" y2="'+yv+'" stroke="#e2e8f0"/><text x="'+(pl-4)+'" y="'+(yv+3)+'" font-size="9" text-anchor="end" fill="#64748b">'+nd(Math.round(mx*k/4*10)/10)+'</text>'}

  series.forEach((s,j)=>s.v.forEach((v,i)=>{const h=v/mx*(H-pt-pb);const x=cx(i)-series.length*bw/2+j*bw;
   o+='<rect x="'+x+'" y="'+(H-pb-h)+'" width="'+(bw-1)+'" height="'+h+'" rx="2" fill="'+s.c+'"/>';
   if(v>0)o+='<text x="'+(x+bw/2-0.5)+'" y="'+(H-pb-h-3)+'" font-size="8" text-anchor="middle" fill="#475569">'+nd(v)+'</text>'}));
  return o+'</svg>'}
 const legend=s=>'<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:6px">'+s.map(x=>'<span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:'+x.c+';margin-left:5px"></span>'+x.n+'</span>').join('')+'</div>';
 const S1=[{n:'شبه‌حادثه',c:'#2563eb',v:nm},{n:'حادثه (جراحت / خسارت)',c:'#dc2626',v:inj},{n:'آنومالی',c:'#d97706',v:uns}];
 const trir=months.map((k,i)=>hrs[i]?rec[i]*200000/hrs[i]:null);
 let lineHTML;

function faNormalize(s){
  if(s==null) return '';
  s=String(s);
  s=s.replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/ۀ/g,'ه').replace(/أ|إ|آ/g,'ا');
  s=s.replace(/[\u064B-\u0652\u0670]/g,'');
  s=s.replace(/\u200c/g,' ');
  s=s.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  s=s.replace(/\s+/g,' ').trim().toLowerCase();
  return s;
}
function buildHaystack(kind, r){
  if(!r) return {text:'', title:'', code:''};
  const M=MODS[kind]||{};
  const parts=[];
  const titleParts=[];
  const codeParts=[];
  (M.fields||[]).forEach(f=>{});
  if(M.t) parts.push(M.t);
  if(kind) parts.push(kind);
  (M.fields||[]).forEach(f=>{
    if(f.gate && (!me || !f.gate.includes(me.role))) return;
    const v=r[f.k];
    if(v===undefined||v===null||v==='') return;
    if(f.t==='people' && Array.isArray(v)){ parts.push(v.join(' ')); return; }
    if(f.t==='chk'){ parts.push(f.l+' '+(v?'بله':'خیر')); return; }
    if(f.t==='tplsel'){ const tname=TPLS[v]?TPLS[v].t:String(v); parts.push(tname); return; }
    if(typeof v==='object'){ flattenObj(v, parts); return; }
    parts.push(String(v));
    if(['title','desc','act','hazard','course','job','item','name','month','topic','task','scenario','param','point','loc','equip','mode','activity','waste'].includes(f.k)){
      titleParts.push(String(v));
    }
  });
  ['id','code','status','type','effectiveness','risk','level','progress','rpn','score','createdBy','createdJ','fixedBy','verifyBy','assessor','inspBy','observer','owner','responsible','presenter','trainer','doctor','auditor','contractor','manifest','phone','hcode','std','unit','size'].forEach(kk=>{
    if(r[kk]!==undefined && r[kk]!==null && r[kk]!=='') parts.push(String(r[kk]));
  });
  if(r.code) codeParts.push(String(r.code));
  if(kind==='incidents' && r.analyses){
    const a=r.analyses;
    if(a.fishbone) Object.keys(a.fishbone).forEach(k=>{ if(a.fishbone[k]) parts.push('فیش‌بون '+k+' '+a.fishbone[k]); });
    if(a.why) Object.keys(a.why).forEach(k=>{ if(a.why[k]) parts.push('چرا '+k+' '+a.why[k]); });
    if(a.m4m) Object.keys(a.m4m).forEach(k=>{ if(a.m4m[k]) parts.push('۴M '+k+' '+a.m4m[k]); });
    if(a.result){ Object.keys(a.result).forEach(k=>{ if(a.result[k]) parts.push(a.result[k]); }); }
  }
  if(kind==='jsa' && Array.isArray(r.steps)){
    r.steps.forEach((s,i)=>{
      parts.push('مرحله '+(i+1));
      if(s.step) parts.push(s.step);
      if(s.hazard) parts.push(s.hazard);
      if(s.ctrl) parts.push(s.ctrl);
      if(s.risk) parts.push(s.risk);
    });
  }
  if(kind==='s5' && r.s5){
    const tpl=(db&&db.s5_tpls)||{};
    Object.keys(r.s5).forEach(key=>{
      const t=tpl[key];
      if(t){ parts.push('S'+t.num+' '+t.name+' '+t.en); }
      parts.push(key);
      const vals=r.s5[key];
      if(vals && typeof vals==='object'){ Object.values(vals).forEach(v=>parts.push(String(v))); }
    });
  }
  if(kind==='inspections' && r.answers && r.tpl && TPLS[r.tpl]){
    const t=TPLS[r.tpl];
    Object.keys(r.answers).forEach(i=>{
      const it=t.items[+i]; const a=r.answers[i];
      if(it) parts.push(it+' '+(a==='ok'?'مناسب':a==='fail'?'مغایرت':'نامرتبط'));
    });
    if(r.fails) r.fails.forEach(f=>parts.push('مغایرت '+f));
  }
  if(r.log && Array.isArray(r.log)){
    r.log.forEach(l=>{ if(l.t) parts.push('گردش کار '+l.t); if(l.u) parts.push(l.u); });
  }
  const text=faNormalize(parts.join(' '));
  const title=titleParts.length?titleParts[0]:'';
  const code=codeParts.length?codeParts[0]:'';
  return {text, title, code};
}
function flattenObj(obj, out){
  if(obj==null) return;
  if(Array.isArray(obj)){ obj.forEach(x=>flattenObj(x,out)); return; }
  if(typeof obj==='object'){ Object.keys(obj).forEach(k=>{ out.push(k); flattenObj(obj[k],out); }); return; }
  out.push(String(obj));
}
function scoreMatch(hay, queryWords, title, code){
  if(!hay || !queryWords.length) return 0;
  let total=0;
  const titleNorm=faNormalize(title||'');
  const codeNorm=faNormalize(code||'');
  for(const w of queryWords){
    if(!w) continue;
    const idx=hay.indexOf(w);
    if(idx<0) return -1;
    let s=1;
    if(titleNorm && titleNorm.indexOf(w)>=0) s+=10;
    if(codeNorm && codeNorm.indexOf(w)>=0) s+=15;
    if(hay===w) s+=20;
    const re=new RegExp('(^|\\s)'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');
    if(re.test(hay)) s+=5;
    const cnt=(hay.match(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'))||[]).length;
    if(cnt>1) s+=Math.min(cnt,5);
    total+=s;
  }
  return total;
}
function snippetAround(text, queryWords, len){
  len=len||90;
  if(!text) return '';
  const lower=text;
  let bestIdx=-1, bestW='';
  for(const w of queryWords){
    if(!w) continue;
    const i=lower.indexOf(w);
    if(i>=0 && (bestIdx<0 || i<bestIdx)){ bestIdx=i; bestW=w; }
  }
  if(bestIdx<0) return text.slice(0,len);
  const start=Math.max(0, bestIdx-Math.floor(len/3));
  const end=Math.min(text.length, bestIdx+len);
  let out=text.slice(start,end);
  if(start>0) out='…'+out;
  if(end<text.length) out=out+'…';
  return out;
}
function safeTitleOf(kind, r){
  const M=MODS[kind]||{};
  const pick=['title','desc','act','hazard','course','job','item','name','month','topic','task','scenario','param','point','loc','equip','mode','activity','waste','phone','code'];
  for(const key of pick){
    const f=(M.fields||[]).find(x=>x.k===key);
    if(f && f.gate && (!me || !f.gate.includes(me.role))) continue;
    const v=r[key];
    if(v && String(v).trim()) return String(v).slice(0,120);
  }
  if(r.code) return r.code;
  return r.id||'';
}

function stableJson(v){
  if(Array.isArray(v)) return '['+v.map(x=>stableJson(x===undefined?null:x)).join(',')+']';
  if(v&&typeof v==='object'){
    const ks=Object.keys(v).filter(k=>{const x=v[k];if(x===undefined)return false;if(Array.isArray(x))return x.length>0;if(x&&typeof x==='object')return Object.keys(x).length>0;return true;}).sort();
    return '{'+ks.map(k=>JSON.stringify(k)+':'+stableJson(v[k])).join(',')+'}';
  }
  return JSON.stringify(v===undefined?null:v);
}

function applyCloud(cloud){
  try{
    const sc = sanitizeData(cloud);
    const norm = stableJson(sc);
    if(norm===_lastCloudNorm) return;
    _lastCloudNorm = norm;
    _isApplyingRemote = true;
    db = sc;
    _base = _baseFrom(sc);
    _baselineOk = true;
    TPLS = db.tpls || defaultTPLS();
    S5 = db.s5_tpls || defaultS5TPLS();
    cacheDb();
    if (me && document.body.classList.contains('modal-open')) {
      _renderAfterModal = true;
    } else if (me) {
      refreshCurrent();
    }
    try{ renderSidebar(); }catch(e){}
  } catch(e) {
    console.warn('خطا در همگام‌سازی remote:', e);
  } finally {
    setTimeout(()=>{ _isApplyingRemote = false; }, 300);
  }
}
async function _pullCloud(){

}

  });
 }
 new MutationObserver(()=>{ if(!pend){ pend=true; requestAnimationFrame(mark); } })
   .observe(document.body,{childList:true,subtree:true});
 document.addEventListener('keydown',e=>{
   const t=e.target;
   if((e.key==='Enter'||e.key===' ') && t && t.matches && t.matches('tr[onclick],.list-row[onclick]')){

/* ============================================================
   فیلتر کشویی زیر عنوان هر ستون برای همه جداول (.tbl)
   مقادیر هر کشویی از خود ستون ساخته می‌شود و با تغییر داده‌ها به‌روز می‌شود
============================================================ */
(function(){
 const FLT_STATE={};
 const st=document.createElement('style');
 st.textContent='.tbl tr.cflt-row th{background:#fff;padding:4px 6px;font-weight:400}.tbl select.cflt{width:100%;min-width:90px;max-width:260px;border:1px solid #cbd5e1;border-radius:7px;padding:4px 6px;font-size:11.5px;background:#fff;font-weight:400;color:var(--ink)}';
 document.head.appendChild(st);
 const norm=s=>String(s||'')
   .replace(/[يى]/g,'ی').replace(/ك/g,'ک')
   .replace(/[۰-۹]/g,d=>String(d.charCodeAt(0)-0x6F0))
   .replace(/[٠-٩]/g,d=>String(d.charCodeAt(0)-0x660))
   .replace(/\s+/g,' ').trim().toLowerCase();
 const cellText=c=>c?String(c.textContent||'').replace(/\s+/g,' ').trim():'';
 // فقط ردیف‌های داده (ردیف پیام «موردی نیست» که colspan دارد کنار گذاشته می‌شود)
 function dataRows(t,n){
  return Array.from(t.tBodies[0].rows).filter(r=>r.cells.length>=n);
 }
 function fillSel(t,i){
  const sel=t._cflt[i]; if(!sel) return;
  const n=t._cflt.length;
  const vals=new Set();
  dataRows(t,n).forEach(r=>{ const v=cellText(r.cells[i]); if(v) vals.add(v); });
  const list=Array.from(vals).sort((a,b)=>a.localeCompare(b,'fa'));
  const sig=list.join('\u0001');
  if(sel._sig===sig) return;
  const cur=sel.value||sel._want||'';
  sel._want='';
  sel._sig=sig;
  const opts=list.slice();
  if(cur && !opts.some(v=>norm(v)===norm(cur))) opts.push(cur);
  sel.innerHTML='<option value="">همه</option>'+opts.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');
  sel.value=cur;
 }
 function fltApply(t){
  const sels=t._cflt; if(!sels||!t.tBodies[0]) return;
  sels.forEach((_,i)=>fillSel(t,i));
  const qs=sels.map(x=>x?norm(x.value):'');
  const active=qs.some(q=>q);
  Array.from(t.tBodies[0].rows).forEach(r=>{
    let ok=true;
    if(active) ok=qs.every((q,i)=>!q||norm(cellText(r.cells[i]))===q);
    r.style.display=ok?'':'none';
  });
 }
 function fltAdd(t){
  if(t._cflt||!t.tHead||!t.tHead.rows.length||!t.tBodies[0]) return;
  const hr=t.tHead.rows[0];
  const heads=Array.from(hr.cells);
  if(!heads.length) return;
  const key=heads.map(c=>c.textContent.trim()).join('|');
  const saved=FLT_STATE[key]||[];
  const fr=t.tHead.insertRow(-1); fr.className='cflt-row';
  const top=hr.offsetHeight;
  t._cflt=heads.map((h,i)=>{
    const td=document.createElement('th');
    td.style.top=top+'px';
    fr.appendChild(td);
    const label=h.textContent.trim();
    if(!label||/عملیات|اقدام/.test(label)) return null;
    const sel=document.createElement('select');
    sel.className='cflt';
    sel._want=saved[i]||'';
    sel.addEventListener('change',()=>{
      FLT_STATE[key]=t._cflt.map(x=>x?x.value:'');
      fltApply(t);
    });
    td.appendChild(sel);
    return sel;
  });
  fltApply(t);
 }
 function scan(){ document.querySelectorAll('table.tbl').forEach(t=>{ if(!t._cflt) fltAdd(t); }); }
 let pend=false;
 const mo=new MutationObserver(muts=>{
  muts.forEach(m=>{
   const el=m.target.nodeType===1?m.target:m.target.parentElement;
   const tb=el&&el.closest('table.tbl');
   if(tb&&tb._cflt) fltApply(tb);
  });
  if(!pend){ pend=true; requestAnimationFrame(()=>{ pend=false; scan(); }); }
 });
 mo.observe(document.body,{childList:true,subtree:true});
 scan();
})();

/* ============================================================
   افزونه‌ها: گزارش چک‌لیست، گزارش تجمیعی، بازرسی‌های عقب‌افتاده،
   خروجی Excel، ایجاد CAPA از مغایرت و یادآور پشتیبان.
   این فایل بعد از app.js بارگذاری می‌شود.
============================================================ */

/* ---------- کمک‌ها: بحرانی، اقلام، تاریخ ---------- */
const INSP_CRIT_TAG = '[بحرانی]';   // اگر در متن قلم چک‌لیست این برچسب باشد، قلم بحرانی است
function inspItemText(t){ return String(t||'').split(INSP_CRIT_TAG).join('').trim(); }
function inspIsCritical(t){ return String(t||'').indexOf(INSP_CRIT_TAG) >= 0; }

// اولویت با نسخهٔ ذخیره‌شدهٔ اقلام در زمان بازرسی است (snapshot)
function inspItemsOf(rec){
  if(Array.isArray(rec.tplItems)) return rec.tplItems;
  const t = (typeof TPLS !== 'undefined') ? TPLS[rec.tpl] : null;
  return t ? t.items : [];
}
function inspTitleOf(rec){
  if(rec.tplTitle) return rec.tplTitle;
  const t = (typeof TPLS !== 'undefined') ? TPLS[rec.tpl] : null;
  return t ? t.t : 'نوع نامشخص';
}
function inspStats(rec){
  const items = inspItemsOf(rec), ans = rec.answers || {};
  let ok=0, fail=0, na=0, none=0, critFail=0;
  items.forEach((t,i)=>{
    const v = ans[i];
    if(v==='ok') ok++;
    else if(v==='fail'){ fail++; if(inspIsCritical(t)) critFail++; }
    else if(v==='na') na++;
    else none++;
  });
  const applic = ok + fail;
  const score = (typeof rec.score==='number') ? rec.score : (applic ? Math.round(ok/applic*100) : 100);
  return {items, ans, ok, fail, na, none, critFail, score};
}

// تاریخ شمسی «YYYY/MM/DD» ↔ شماره روز (JDN-like) با تبدیل‌های موجود در برنامه
function jalStrToDay(s){
  const m = String(s||'').match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/);
  if(!m) return null;
  const g = j2g(+m[1], +m[2], +m[3]);
  return g2d(g.gy, g.gm, g.gd);
}
function todayDay(){ const n=new Date(); return g2d(n.getFullYear(), n.getMonth()+1, n.getDate()); }
function dayToJalStr(day){
  const g = d2g(day);
  const j = g2j(g.gy, g.gm, g.gd);
  return j.jy + '/' + p2(j.jm) + '/' + p2(j.jd);
}

/* ---------- بازرسی‌های عقب‌افتاده ---------- */
// برای هر چک‌لیست: آخرین بازرسی، سررسید بعدی و میزان تأخیر (روز)
function inspOverdue(){
  const today = todayDay();
  const recs = db.inspections || [];
  return Object.keys(TPLS).map(tk=>{
    const t = TPLS[tk];
    const mine = recs.filter(r=>r.tpl===tk)
      .map(r=>({r, d:jalStrToDay(r.date)}))
      .filter(x=>x.d!==null)
      .sort((a,b)=>b.d-a.d);
    if(!mine.length) return {tk, title:t.t, never:true, late:null, due:null, last:null};
    const last = mine[0];
    const due = last.d + (+t.period || 0);
    return {tk, title:t.t, never:false, last:last.r.date, due:dayToJalStr(due), late: today - due};
  });
}

/* ---------- گزارش یک بازرسی (جایگزین نسخهٔ قبلی) ---------- */
function exportInspectionReport(rec, format){

    ? '<span style="color:#dc2626;font-weight:700">ناقص — مغایرت در ' + nd(st.critFail) + ' قلم بحرانی</span>'
    : st.fail
      ? '<span style="color:#d97706;font-weight:700">نیاز به اقدام اصلاحی — ' + nd(st.fail) + ' مغایرت</span>'
      : '<span style="color:#16a34a;font-weight:700">مطابق — بدون مغایرت</span>';
  const scoreColor = st.score>=90 ? '#16a34a' : st.score>=70 ? '#d97706' : '#dc2626';

  let h = '<style>tr{page-break-inside:avoid}thead{display:table-header-group}</style>';
  h += '<h1>📋 گزارش چک‌لیست: ' + esc(inspTitleOf(rec)) + '</h1>';
  h += '<p>کد: <b>' + esc(rec.id) + '</b> — تاریخ بازرسی: <b>' + nd(rec.date||'—') + '</b> — بازرس: <b>' + esc(rec.inspBy||'—') + '</b></p>';
  if(!st.items.length) h += '<p style="color:#dc2626">⚠️ اقلام این بازرسی در دسترس نیست؛ فقط امتیاز ثبت‌شده نمایش داده می‌شود.</p>';
  else if(!rec.tplItems) h += '<p style="color:#92400e;background:#fef3c7;padding:6px 10px;border-radius:6px">ℹ️ این بازرسی قبل از ذخیرهٔ نسخهٔ اقلام ثبت شده است؛ اقلام بر اساس چک‌لیست فعلی نمایش داده می‌شوند و ممکن است با زمان بازرسی یکسان نباشند.</p>';

  h += '<div class="kpi-row">'
    + '<div class="kpi-box">امتیاز انطباق<b style="color:'+scoreColor+'">' + nd(st.score) + '٪</b></div>'
    + '<div class="kpi-box">مناسب<b style="color:#16a34a">' + nd(st.ok) + '</b></div>'
    + '<div class="kpi-box">مغایرت<b style="color:#dc2626">' + nd(st.fail) + '</b></div>'
    + '<div class="kpi-box">بحرانی با مغایرت<b style="color:#dc2626">' + nd(st.critFail) + '</b></div>'
    + '<div class="kpi-box">نامرتبط<b>' + nd(st.na) + '</b></div>'
    + '</div>';
  h += '<p><b>نتیجه کلی: </b>' + verdict + '</p>';

  if(st.items.length){
    h += '<h2>نتایج اقلام</h2><table><thead><tr><th style="width:7%">ردیف</th><th>مورد بازرسی</th><th style="width:18%">نتیجه</th></tr></thead><tbody>';
    st.items.forEach((t,i)=>{
      const v = st.ans[i];
      const res = v==='ok' ? '<span style="color:#16a34a;font-weight:700">✔ مناسب</span>'
                : v==='fail' ? '<span style="color:#dc2626;font-weight:700">✘ مغایرت</span>'
                : v==='na' ? '<span style="color:#64748b">— نامرتبط</span>'
                : '<span style="color:var(--mut)">بدون پاسخ</span>';
      const bg = v==='fail' ? 'background:#fee2e2;' : '';
      const crit = inspIsCritical(t) ? '⭐ ' : '';
      h += '<tr style="'+bg+'"><td style="text-align:center">'+nd(i+1)+'</td><td>'+crit+esc(inspItemText(t))+'</td><td style="text-align:center">'+res+'</td></tr>';
    });
    h += '</tbody></table>';
    h += '<p style="font-size:9pt;color:#64748b">⭐ = قلم بحرانی؛ مغایرت در این اقلام نتیجه را «ناقص» می‌کند.</p>';
  }

  if(st.fail){
    h += '<h2>پیگیری مغایرت‌ها</h2><table><thead><tr><th style="width:7%">ردیف</th><th>شرح مغایرت</th><th style="width:30%">اقدام اصلاحی لازم</th><th style="width:14%">مسئول</th><th style="width:12%">مهلت</th></tr></thead><tbody>';
    st.items.forEach((t,i)=>{
      if(st.ans[i]==='fail') h += '<tr><td style="text-align:center">'+nd(i+1)+'</td><td>'+esc(inspItemText(t))+'</td><td>&nbsp;<br>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>';

    h += '</tbody></table>';
  }

  if(rec.note) h += '<h2>توضیحات بازرس</h2><p>' + esc(rec.note) + '</p>';

  if(format==='print') printHTML(h, fn); else if(format==='word') exportWord(h, fn); else exportPDF(h, fn);

/* ---------- گزارش تجمیعی (سال جاری) ---------- */
function exportInspectionsSummary(format){
  const yr = todayJ().slice(0,4);
  const all = db.inspections || [];
  const recs = all.filter(r=>String(r.date||'').slice(0,4)===yr);
  const od = inspOverdue();

  let h = '<style>tr{page-break-inside:avoid}thead{display:table-header-group}</style>';
  h += '<h1>📊 گزارش تجمیعی چک‌لیست‌ها — سال '+nd(yr)+'</h1>';
  h += '<p>تاریخ تهیه: '+nd(todayJ())+' — تهیه‌کننده: '+esc(me.name)+' — بازرسی‌های امسال: <b>'+nd(recs.length)+'</b></p>';

  // ۱. خلاصه هر چک‌لیست + وضعیت سررسید
  h += '<h2>۱. خلاصه هر چک‌لیست (بازرسی‌های سال جاری)</h2>';
  h += '<table><thead><tr><th>چک‌لیست</th><th>دوره</th><th>تعداد بازرسی</th><th>میانگین امتیاز</th><th>کمترین امتیاز</th><th>آخرین بازرسی</th><th>وضعیت سررسید</th></tr></thead><tbody>';
  Object.keys(TPLS).forEach(tk=>{
    const t = TPLS[tk];
    const mine = recs.filter(r=>r.tpl===tk);
    const scores = mine.map(r=>inspStats(r).score);
    const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : null;
    const min = scores.length ? Math.min(...scores) : null;
    const last = mine.map(r=>r.date).sort().pop() || '—';
    const row = od.find(x=>x.tk===tk);
    let status;
    if(!row || row.never) status = '<span style="color:#dc2626">هنوز بازرسی ثبت نشده</span>';
    else if(row.late>0) status = '<span style="color:#dc2626;font-weight:700">⚠️ '+nd(row.late)+' روز تأخیر (سررسید: '+nd(row.due)+')</span>';
    else status = '<span style="color:#16a34a">به‌موقع — سررسید بعدی: '+nd(row.due)+'</span>';
    h += '<tr><td>'+esc(t.t)+'</td><td>هر '+nd(t.period)+' روز</td><td style="text-align:center">'+nd(mine.length)+'</td>'
       + '<td style="text-align:center">'+(avg===null?'—':nd(avg)+'٪')+'</td>'
       + '<td style="text-align:center">'+(min===null?'—':nd(min)+'٪')+'</td>'
       + '<td>'+nd(last)+'</td><td>'+status+'</td></tr>';
  });
  h += '</tbody></table>';

  // ۲. اقلامی که بیشتر شکست خورده‌اند
  const failCount = {};
  recs.forEach(r=>{
    const st = inspStats(r);
    st.items.forEach((t,i)=>{
      if(st.ans[i]==='fail'){
        const key = inspItemText(t);
        failCount[key] = (failCount[key]||0) + 1;
      }
    });
  });
  const top = Object.keys(failCount).map(k=>({k, n:failCount[k]})).sort((a,b)=>b.n-a.n).slice(0,10);
  h += '<h2>۲. کنترل‌هایی که بیشتر مغایرت داشته‌اند</h2>';
  if(!top.length) h += '<p>در این سال مغایرتی ثبت نشده است.</p>';
  else {
    h += '<table><thead><tr><th style="width:7%">ردیف</th><th>مورد بازرسی</th><th style="width:15%">تعداد مغایرت</th></tr></thead><tbody>';
    top.forEach((x,i)=>{ h += '<tr><td style="text-align:center">'+nd(i+1)+'</td><td>'+esc(x.k)+'</td><td style="text-align:center">'+nd(x.n)+'</td></tr>'; });
    h += '</tbody></table>';
  }

  // ۳. روند ماهانه امتیاز
  const byMonth = {};
  recs.forEach(r=>{
    const mk = String(r.date||'').slice(0,7);
    if(!mk) return;
    (byMonth[mk] = byMonth[mk] || []).push(inspStats(r).score);
  });
  const months = Object.keys(byMonth).sort();
  h += '<h2>۳. روند ماهانه امتیاز انطباق</h2>';
  if(!months.length) h += '<p>داده‌ای برای نمایش روند وجود ندارد.</p>';
  else {
    h += '<table><thead><tr><th style="width:18%">ماه</th><th style="width:12%">تعداد</th><th style="width:12%">میانگین</th><th>نمودار</th></tr></thead><tbody>';
    months.forEach(mk=>{
      const arr = byMonth[mk];
      const avg = Math.round(arr.reduce((a,b)=>a+b,0)/arr.length);
      const barColor = avg>=90 ? '#16a34a' : avg>=70 ? '#d97706' : '#dc2626';
      h += '<tr><td>'+nd(mk)+'</td><td style="text-align:center">'+nd(arr.length)+'</td><td style="text-align:center">'+nd(avg)+'٪</td>'
         + '<td><div style="background:#f1f5f9;border-radius:6px;height:12px;width:100%"><div style="background:'+barColor+';height:12px;border-radius:6px;width:'+avg+'%"></div></div></td></tr>';
    });
    h += '</tbody></table>';
  }

  // ۴. بازرسی‌های عقب‌افتاده
  h += '<h2>۴. بازرسی‌های عقب‌افتاده و سررسیدها (بر اساس آخرین بازرسی در همه سال‌ها)</h2>';
  h += '<table><thead><tr><th>چک‌لیست</th><th>آخرین بازرسی</th><th>سررسید بعدی</th><th>وضعیت</th></tr></thead><tbody>';
  od.forEach(x=>{
    const st = x.never ? '<span style="color:#dc2626">هرگز بازرسی نشده</span>'
      : x.late>0 ? '<span style="color:#dc2626;font-weight:700">عقب‌افتاده — '+nd(x.late)+' روز</span>'
      : '<span style="color:#16a34a">به‌موقع</span>';
    h += '<tr><td>'+esc(x.title)+'</td><td>'+(x.last?nd(x.last):'—')+'</td><td>'+(x.due?nd(x.due):'—')+'</td><td>'+st+'</td></tr>';
  });
  h += '</tbody></table>';

  const fn = 'HSE-checklist-summary-'+yr+'-'+todayJ().replace(/\//g,'-');
  if(format==='word') exportWord(h, fn); else exportPDF(h, fn);
}

/* ---------- خروجی Excel (CSV با BOM برای نمایش درست فارسی) ---------- */
function csvCell(v){ return '"' + String(v==null?'':v).replace(/"/g,'""') + '"'; }
function exportInspectionsCSV(){
  const recs = (db.inspections || []).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  if(!recs.length){ toast('بازرسی ثبت‌شده‌ای وجود ندارد'); return; }
  const RES = {ok:'مناسب', fail:'مغایرت', na:'نامرتبط'};
  const head = ['کد بازرسی','تاریخ','بازرس','نوع چک‌لیست','ردیف','مورد بازرسی','نتیجه','بحرانی','امتیاز بازرسی','توضیحات'];
  const lines = [head.map(csvCell).join(',')];
  recs.forEach(r=>{
    const st = inspStats(r);
    st.items.forEach((t,i)=>{
      lines.push([
        r.id, r.date, r.inspBy, inspTitleOf(r), i+1, inspItemText(t),
        RES[st.ans[i]] || 'بدون پاسخ', inspIsCritical(t) ? 'بله' : 'خیر', st.score, r.note || ''
      ].map(csvCell).join(','));
    });
  });
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  saveBlob(blob, 'HSE-inspections-' + todayJ().replace(/\//g,'-') + '.csv', 'text/csv');
}

/* ---------- ایجاد CAPA از یک مغایرت ---------- */
function capaFromInspection(id, i){
  const r = (db.inspections || []).find(x=>x.id===id);
  if(!r) return;
  const st = inspStats(r);
  const item = st.items[i] || '';
  closeModal();
  openForm('actions', null, {
    src:'بازرسی', ref:r.id, type:'اصلاحی (Corrective)', prio:'بالا',
    startD: todayJ(),
    desc:'رفع مغایرت در '+inspTitleOf(r)+': '+inspItemText(item)
  });
}

// در صفحهٔ جزئیات بازرسی، برای هر مغایرت دکمهٔ ایجاد CAPA اضافه می‌شود

/* ============================================================
   یادآور پشتیبان‌گیری دوره‌ای
============================================================ */
(function(){
  const KEY = 'hse_last_backup';
  const WARN_AFTER_DAYS = 7;
  const SESSION_FLAG = 'hse_bk_warned';
  function daysSinceBackup(){
    try{
      const t = Number(localStorage.getItem(KEY) || 0);
      if(!t) return Infinity;
      return (Date.now() - t) / 86400000;
    }catch(e){ return 0; }
  }
  function maybeRemind(){
    try{
      if(sessionStorage.getItem(SESSION_FLAG)) return;
      if(typeof me === 'undefined' || !me) return;
      const d = daysSinceBackup();
      if(d < WARN_AFTER_DAYS) return;
      sessionStorage.setItem(SESSION_FLAG, '1');
      const msg = d === Infinity
        ? 'هنوز هیچ پشتیبانی تهیه نشده است. از منوی تنظیمات یک پشتیبان بگیرید.'
        : 'بیش از ' + Math.floor(d) + ' روز از آخرین پشتیبان می‌گذرد. لطفاً یک پشتیبان تازه بگیرید.';
      if(typeof toast === 'function') toast('💾 ' + msg);
    }catch(e){ console.warn('یادآور پشتیبان:', e); }
  }
  window.addEventListener('load', function(){ setTimeout(maybeRemind, 4000); });
})();

/* ============================================================
   برچسب‌گذاری یک‌باره اقلام بحرانی پیش‌فرض (فقط توسط مدیر و فقط یک بار روی هر دستگاه)
   اقلامی که کلیدواژه‌هایشان در فهرست زیر است و هنوز برچسب ندارند، [بحرانی] می‌گیرند.
============================================================ */
(function(){
  const FLAG = 'hse_crit_v1';
  const CRIT_KEYWORDS = [
    'عدم نشتی آب خنک','خشک بودن محوطه','عملکرد صحیح سیستم سوخت','دسترسی آزاد به کلید اضطراری',
    'لیمیت','سالم بودن سیم','ترمزهای بالا','سالم بودن قلاب',
    'ترمز سرویس','عدم نشتی گاز LPG','ROPS',
    'وجود کپسول در محل',
    'سالم بودن حفاظ','باز بودن خروجی','استفاده صحیح PPE',
    'ماسک تنفسی'
  ];
  function run(){
    try{
      if(localStorage.getItem(FLAG)) return;
      if(!me || me.role!=='manager' || typeof TPLS==='undefined' || !TPLS || typeof queueModule!=='function') return;
      let changed = 0;
      Object.keys(TPLS).forEach(tk=>{
        const t = TPLS[tk];
        if(!t || !Array.isArray(t.items)) return;
        t.items = t.items.map(it=>{
          if(inspIsCritical(it)) return it;
          const txt = String(it);
          if(CRIT_KEYWORDS.some(k=>txt.indexOf(k)>=0)){ changed++; return txt + ' ' + INSP_CRIT_TAG; }
          return it;
        });
      });
      if(changed){ db.tpls = TPLS; queueModule('tpls'); save({immediate:true}); }
      localStorage.setItem(FLAG, '1');
      if(changed && typeof toast==='function') toast('✔ '+changed+' قلم بحرانی پیش‌فرض برچسب‌گذاری شد');
    }catch(e){ console.warn('برچسب‌گذاری اقلام بحرانی:', e); }
  }
  window.addEventListener('load', function(){ setTimeout(run, 6000); });
})();


/* ============================================================
   گزارش عملکرد شخصی با انتخاب بازه‌ی تاریخ
   فقط رکوردهای مرتبط با حساب کاربر فعلی را نشان می‌دهد
============================================================ */
(function(){
  var KEY='myReport';
  var _origCanView=canView;
  canView=function(k){ if(k===KEY) return !!me; return _origCanView(k); };
  SPECIAL[KEY]={t:'گزارش عملکرد من',i:'📑',ren:myReportPage};
  NAV.push({g:'گزارش شخصی',items:[KEY]});

  var AR={'۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9','٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
  function normDate(s){
    var x=String(s==null?'':s).replace(/[۰-۹٠-٩]/g,function(c){return AR[c]}).trim().replace(/-/g,'/');
    var m=x.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
    if(!m) return '';
    return m[1]+'/'+('0'+m[2]).slice(-2)+'/'+('0'+m[3]).slice(-2);
  }
  function recDate(r){ return normDate(r.date||r.startD||r.createdJ||''); }
  function inR(r,f,t){ var d=recDate(r); return !!d && d>=f && d<=t; }
  function listHas(a,n){ return Array.isArray(a) && a.indexOf(n)>=0; }
  function arr(k){ return (db && db[k]) || []; }
  function sumOf(a,key){ return a.reduce(function(s,r){return s+(Number(r[key])||0)},0); }
  var CLOSED=['تایید و بسته شد','رد شده'];

  function buildData(f,t){
    var n=me.name, D={}, today=todayJ();
    D.incRep=arr('incidents').filter(function(r){return r.createdBy===n && inR(r,f,t)});
    D.incNear=D.incRep.filter(function(r){return String(r.type||'').indexOf('شبه')>=0});
    D.incInj=arr('incidents').filter(function(r){return r.injured===n && inR(r,f,t)});
    D.uns=arr('unsafe').filter(function(r){return (r.observer===n||r.createdBy===n) && inR(r,f,t)});
    D.acts=arr('actions').filter(function(r){return r.owner===n && inR(r,f,t)});
    D.actOpen=D.acts.filter(function(r){return CLOSED.indexOf(r.status)<0});
    D.actLate=D.actOpen.filter(function(r){var d=normDate(r.due);return !!d && d<today});
    D.actDone=D.acts.filter(function(r){return r.status==='تایید و بسته شد'});
    D.insp=arr('inspections').filter(function(r){return r.inspBy===n && inR(r,f,t)});
    D.risks=arr('risks').filter(function(r){return r.owner===n && inR(r,f,t)});
    D.trn=arr('trainings').filter(function(r){return listHas(r.people,n) && inR(r,f,t)});
    D.trnH=sumOf(D.trn,'dur');
    D.tbm=arr('tbm').filter(function(r){return listHas(r.people,n) && inR(r,f,t)});
    D.tbt=arr('toolbox').filter(function(r){return listHas(r.people,n) && inR(r,f,t)});
    D.bbs=arr('bbs').filter(function(r){return r.person===n && inR(r,f,t)});
    D.bbsSafe=sumOf(D.bbs,'safe');
    D.bbsUnsafe=sumOf(D.bbs,'unsafe');
    D.bbsWarn=D.bbs.filter(function(r){return r.warned==='بله'}).length;
    D.ppe=arr('ppeTx').filter(function(r){return r.person===n && inR(r,f,t)});
    D.ptw=arr('ptw').filter(function(r){return listHas(r.workers,n) && inR(r,f,t)});
    D.sv=arr('siteVisit').filter(function(r){return (r.visitor===n || r.createdBy===n) && inR(r,f,t)});
    D.svFix=D.sv.filter(function(r){return r.result===SV_RES[1]}).length;
    return D;
  }

  function row(l,v){
    return '<tr><td>'+esc(l)+'</td><td style="text-align:right;font-weight:700">'+v+'</td></tr>';
  }

  function sumRows(D){
    return [
      ['حوادث و شبه‌حادثه ثبت‌شده', D.incRep.length, 'شبه‌حادثه: '+D.incNear.length],
      ['حادثه‌ای که در آن مصدوم بوده‌اید', D.incInj.length, ''],
      ['آنومالی‌های ثبت‌شده', D.uns.length, ''],
      ['اقدامات اصلاحی (مسئول)', D.acts.length, 'باز: '+D.actOpen.length+' · معوق: '+D.actLate.length+' · بسته‌شده: '+D.actDone.length],
      ['بازرسی‌های انجام‌شده', D.insp.length, ''],
      ['ریسک‌های تحت مسئولیت', D.risks.length, ''],
      ['دوره‌های آموزشی (حضور)', D.trn.length, D.trnH+' ساعت'],
      ['جلسات TBM (حضور)', D.tbm.length, ''],
      ['جلسات TBT (حضور)', D.tbt.length, ''],
      ['مشاهدات رفتاری BBS', D.bbs.length, 'ایمن: '+D.bbsSafe+' · ناایمن: '+D.bbsUnsafe+' · تذکر: '+D.bbsWarn],
      ['تجهیزات PPE تحویل‌شده', D.ppe.length, ''],
      ['مجوز کار (PTW) با نام شما', D.ptw.length, ''],
      ['بازدید محل کار (SITE VISIT)', D.sv.length, 'نیازمند اصلاح: '+D.svFix]
    ];
  }
  function cardsHtml(D){
    var late=D.actLate.length;
    var cards=[
      {l:'حوادث و شبه‌حادثه', v:D.incRep.length, s:'شبه‌حادثه: '+D.incNear.length, c:D.incRep.length?'red':'green'},
      {l:'اقدامات اصلاحی', v:D.acts.length, s:'باز: '+D.actOpen.length+' · معوق: '+late, c:late?'red':'orange'},
      {l:'آموزش و جلسات', v:D.trn.length, s:D.trnH+' ساعت آموزش · TBM: '+D.tbm.length+' · TBT: '+D.tbt.length, c:'green'},
      {l:'مشاهدات BBS', v:D.bbs.length, s:'ایمن: '+D.bbsSafe+' · ناایمن: '+D.bbsUnsafe, c:'blue'}
    ];
    return '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:6px">'
      +cards.map(function(x){
        return '<div class="kpi '+x.c+'"><div class="kl">'+esc(x.l)+'</div><div class="kv">'+nd(x.v)+'</div><div class="ks">'+nd(esc(x.s))+'</div></div>';
      }).join('')+'</div>';
  }
  function sumTable(D,doc){
    var h='<table'+(doc?'':' class="tbl"')+'><thead><tr><th>شاخص</th><th>مقدار</th><th>جزئیات</th></tr></thead><tbody>';
    sumRows(D).forEach(function(r){
      h+='<tr><td>'+esc(r[0])+'</td><td style="font-weight:700;text-align:center">'+nd(r[1])+'</td><td>'+nd(esc(r[2]))+'</td></tr>';
    });

  }
  function detailItems(D){
    var items=[];
    D.incRep.forEach(function(r){items.push({d:recDate(r),k:'حادثه / شبه‌حادثه',x:r.title||r.type||'',s:r.status||''})});
    D.incInj.forEach(function(r){items.push({d:recDate(r),k:'حادثه (مصدوم)',x:r.title||'',s:r.status||''})});
    D.uns.forEach(function(r){items.push({d:recDate(r),k:'آنومالی',x:r.desc||'',s:r.status||''})});
    D.acts.forEach(function(r){items.push({d:recDate(r),k:'اقدام اصلاحی',x:(r.code?'['+r.code+'] ':'')+(r.desc||''),s:r.status||''})});
    D.trn.forEach(function(r){items.push({d:recDate(r),k:'آموزش',x:r.course||'',s:'حاضر'})});
    D.sv.forEach(function(r){items.push({d:recDate(r),k:'بازدید محل کار',x:r.activity||'',s:r.result||''})});
    items.sort(function(a,b){return String(b.d).localeCompare(String(a.d))});
    return items;
  }
  /* doc=true: خلاصه‌ی ساده برای فایل Word/PDF/چاپ؛ doc=false: نمای صفحه با کارت‌ها و ریز رکوردها */
  function reportBody(f,t,doc){
    var D=buildData(f,t);
    var any=[D.incRep,D.incInj,D.uns,D.acts,D.insp,D.risks,D.trn,D.tbm,D.tbt,D.bbs,D.ppe,D.ptw,D.sv].some(function(a){return a.length});
    var range='<b>'+nd(f)+'</b> تا <b>'+nd(t)+'</b>';
    if(doc){
      return '<p>بازه گزارش: '+range+'</p>'+(any?sumTable(D,true):'<p>در این بازه هیچ فعالیتی برای شما ثبت نشده است.</p>');
    }
    if(!any){
      return '<div class="mstats" style="margin-bottom:12px">بازه گزارش: '+range+'</div>'
        +'<div style="text-align:center;color:var(--mut);padding:28px 12px;border:1px dashed var(--line);border-radius:12px">در این بازه هیچ فعالیتی برای شما ثبت نشده است.</div>';
    }
    var h='<div class="mstats" style="margin-bottom:12px">بازه گزارش: '+range+'</div>'+cardsHtml(D)
      +'<div class="sechead" style="margin-top:14px">📋 جدول خلاصه</div>'+sumTable(D,false);
    var items=detailItems(D);
    if(items.length){
      h+='<div class="sechead" style="margin-top:18px">🗂️ ریز رکوردها <span class="chip b-mut">'+nd(items.length)+'</span></div>'
        +'<div class="tscroll"><table class="tbl"><thead><tr><th>تاریخ</th><th>نوع</th><th>شرح</th><th>وضعیت</th></tr></thead><tbody>'
        +items.map(function(it){return '<tr><td>'+nd(it.d)+'</td><td><span class="chip b-org">'+esc(it.k)+'</span></td><td>'+esc(it.x)+'</td><td>'+esc(it.s)+'</td></tr>'}).join('')
        +'</tbody></table></div>';
    }
    return h;
  }

  var PERIODS=[['day','روزانه'],['week','هفتگی'],['month','ماهانه'],['quarter','سه‌ماهه'],['year','سالانه'],['custom','دلخواه']];
  function fmtJ(y,m,d){ return y+'/'+p2(m)+'/'+p2(d); }
  function dayAdd(s,n){
    var g=jParse(s); if(!g) return '';
    var d=new Date(g.gy,g.gm-1,g.gd+n);
    var j=g2j(d.getFullYear(),d.getMonth()+1,d.getDate());
    return fmtJ(j.jy,j.jm,j.jd);
  }
  function diffDays(a,b){
    var ga=jParse(a), gb=jParse(b); if(!ga||!gb) return 0;
    return Math.round((new Date(gb.gy,gb.gm-1,gb.gd)-new Date(ga.gy,ga.gm-1,ga.gd))/86400000);
  }
  // بازه‌ی کامل دوره‌ای که تاریخ «a» در آن قرار دارد
  function periodRange(p,a){
    var x=a.split('/').map(Number), jy=x[0], jm=x[1];
    if(p==='day') return [a,a];
    if(p==='week'){
      var g=jParse(a), dow=new Date(g.gy,g.gm-1,g.gd).getDay();
      var start=dayAdd(a,-((dow+1)%7));
      return [start,dayAdd(start,6)];
    }
    if(p==='month'){ var s1=fmtJ(jy,jm,1); return [s1,dayAdd(jAddM(s1,1),-1)]; }
    if(p==='quarter'){ var qm=Math.floor((jm-1)/3)*3+1, s2=fmtJ(jy,qm,1); return [s2,dayAdd(jAddM(s2,3),-1)]; }
    if(p==='year'){ var s3=fmtJ(jy,1,1); return [s3,dayAdd(jAddM(s3,12),-1)]; }
    return null;
  }
  function shiftRange(p,f,t,n){
    if(p==='custom'){
      var span=diffDays(f,t)+1;
      return [dayAdd(f,n*span),dayAdd(t,n*span)];
    }
    var anchor;
    if(p==='day') anchor=dayAdd(f,n);
    else if(p==='week') anchor=dayAdd(f,7*n);
    else if(p==='month') anchor=jAddM(f,n);
    else if(p==='quarter') anchor=jAddM(f,3*n);
    else anchor=jAddM(f,12*n);
    return periodRange(p,anchor);
  }

  function myReportPage(){
    if(!me) return '';
    var r=periodRange('month',todayJ());
    var opts=PERIODS.map(function(o){return '<option value="'+o[0]+'"'+(o[0]==='month'?' selected':'')+'>'+o[1]+'</option>'}).join('');

      +'<div><div style="'+lbl+'">از تاریخ</div><input id="mr_from" class="in sm" value="'+r[0]+'" placeholder="1404/01/01" oninput="myReportManual()" style="direction:ltr;text-align:center"></div>'
      +'<div><div style="'+lbl+'">تا تاریخ</div><input id="mr_to" class="in sm" value="'+r[1]+'" placeholder="1404/01/31" oninput="myReportManual()" style="direction:ltr;text-align:center"></div>'
      +'<button class="btn pri sm" onclick="myReportRun()">🔍 نمایش</button>'
      +'<button class="btn ghost sm" onclick="myReportRun(\'word\')">📄 Word</button>'
      +'<button class="btn ghost sm" onclick="myReportRun(\'pdf\')">📄 PDF</button>'
      +'<button class="btn ghost sm" onclick="myReportRun(\'print\')">🖨️ چاپ</button>'
      +'</div>'
      +'<div class="mstats" style="margin:10px 0 0">دوره را انتخاب کنید، یا تاریخ‌ها را به صورت ۱۴۰۴/۰۱/۰۱ وارد کنید.</div>'
      +'<div id="mr_out" style="margin-top:14px">'+reportBody(r[0],r[1])+'</div></div>';

  window.myReportPeriod=function(p){
    if(p==='custom') return;

  function myActions(f,t){

        if(!r || !r.id || !isOwnRecord(k,r)) return;

  function myActionSection(a){
    var html='<h2>'+a.icon+' '+esc(a.mod)+' — '+esc(a.title)+'</h2>'

  function docHead(f,t){
    var role=(ROLE_CHIP[me.role]||[''])[0];
    return '<h1>📑 گزارش عملکرد — '+esc(me.name)+'</h1>'
      +'<table><tbody>'
      +'<tr><th style="width:22%">نام</th><td>'+esc(me.name)+'</td><th style="width:22%">سمت</th><td>'+esc(role||'—')+'</td></tr>'

<script>
/* جستجو در لیست انتخاب نام‌ها (پرسنل) — چک‌باکس‌ها و منوهای کشویی */
(function(){
  function nrm(s){
    return String(s||'').replace(/\u200c/g,'').replace(/\u064a/g,'\u06cc').replace(/\u0643/g,'\u06a9')
      .replace(/\s+/g,' ').trim().toLowerCase();
  }
  function mkSearch(){
    var i=document.createElement('input');
    i.type='search'; i.className='in name-search'; i.placeholder='🔍 جستجوی نام...';
    i.autocomplete='off';
    i.style.cssText='margin-bottom:6px;font-size:12.5px;padding:6px 10px';
    return i;
  }
  function enhancePbox(pb){
    if(pb.dataset.nsEnh) return;
    var boxes=pb.querySelectorAll('input[type=checkbox]');
    if(!boxes.length) return;
    var isName=Array.prototype.some.call(boxes,function(c){return c.hasAttribute('ppi')||c.name==='s5_members';});
    if(!isName) return;
    pb.dataset.nsEnh='1';
    var inp=mkSearch();
    var cnt=document.createElement('div');
    cnt.style.cssText='font-size:11px;color:var(--mut);margin:-2px 0 6px';
    pb.parentNode.insertBefore(inp,pb);
    pb.parentNode.insertBefore(cnt,pb);
    inp.addEventListener('input',function(){
      var q=nrm(inp.value), shown=0, total=0;
      pb.querySelectorAll('label').forEach(function(l){
        total++;
        var ok=!q || nrm(l.textContent).indexOf(q)!==-1;
        l.style.display=ok?'':'none';
        if(ok) shown++;
      });
      cnt.textContent=q ? ('نمایش '+shown+' از '+total+' نفر') : '';
    });
  }
  function isNameSelect(sel){
    if(typeof db==='undefined' || !db || !Array.isArray(db.personnel)) return false;
    var names=new Set(db.personnel.map(function(p){return p.name;}));
    var vals=Array.prototype.map.call(sel.options,function(o){return o.value;})
      .filter(function(v){return v!=='' && v!=='خیر';});
    if(!vals.length) return false;
    var matched=vals.filter(function(v){return names.has(v);}).length;
    return matched>0 && matched/vals.length>=0.5;
  }
  function enhanceSelect(sel){
    if(sel.dataset.nsEnh) return;
    if(!isNameSelect(sel)) return;
    sel.dataset.nsEnh='1';
    var all=Array.prototype.map.call(sel.options,function(o){return {v:o.value,t:o.text};});
    var inp=mkSearch();
    var anchor=sel.closest('.addopt-wrap')||sel;
    anchor.parentNode.insertBefore(inp,anchor);
    inp.addEventListener('input',function(){
      var q=nrm(inp.value), cur=sel.value;
      sel.innerHTML='';
      all.forEach(function(o){
        var keep = o.v==='' || o.v===cur || !q || nrm(o.t).indexOf(q)!==-1;
        if(keep) sel.add(new Option(o.t,o.v,false,o.v===cur));
      });
    });
  }
  function scan(root){
    root.querySelectorAll('.pbox').forEach(enhancePbox);
    root.querySelectorAll('select').forEach(enhanceSelect);
  }
  var mb=document.getElementById('mbody');
  if(mb){
    scan(mb);
    new MutationObserver(function(){scan(mb);}).observe(mb,{childList:true,subtree:true});
  }
})();
</script>
<script>
/* اعلان سیستمی برای هر رکورد جدید یا تغییر وضعیت که همکاران ثبت می‌کنند */
(function(){
  const NOTIFY_OWN = false;          /* true = اعلان برای کارهای خودتان هم نشان داده شود */
  let prevSnap = null;
  /* ثبت سرویس‌ورکر اعلان (sw.js باید کنار index.html در همان پوشه باشد) */
  let swReady = null;
  if('serviceWorker' in navigator){
    swReady = navigator.serviceWorker.register('./sw.js')
      .then(r => navigator.serviceWorker.ready.then(() => r))
      .catch(err => { console.warn('sw.js:', err); return null; });
  }

  function canNotify(){ return 'Notification' in window && Notification.permission==='granted'; }

  async function show(title, body, tag){
    if(!canNotify()) return;
    const opts = {body: body, tag: tag, dir:'rtl', lang:'fa', renotify:true};
    try{
      const reg = swReady ? await swReady : null;
      if(reg && reg.showNotification) await reg.showNotification(title, opts);
      else new Notification(title, opts);
    }catch(e){ console.warn('notification:', e); }
  }

  function titleOf(r){ return r.title || r.desc || r.name || r.area || r.label || r.id || ''; }

  function snapshotOf(d){
    const o = {};
    RECORD_MODS.forEach(k => {
      const arr = d && d[k];
      if(!arr) return;
      const list = Array.isArray(arr) ? arr : Object.values(arr);
      o[k] = {};
      list.forEach(r => {
        if(r && r.id) o[k][r.id] = {status: r.status||'', by: r.createdBy||'', text: titleOf(r)};
      });
    });
    return o;
  }

  function diffAndNotify(){
    if(!prevSnap || !db) return;
    const now = snapshotOf(db);
    const me_name = (me && me.name) || '';
    RECORD_MODS.forEach(k => {
      const cur = now[k]; if(!cur) return;
      const old = prevSnap[k] || {};
      const M = MODS[k] || {t:k, i:'🔔'};
      Object.keys(cur).forEach(id => {
        const n = cur[id], o = old[id];
        if(!o){
          if(!NOTIFY_OWN && n.by && n.by===me_name) return;
          const t = M.i+' '+M.t+' جدید';
          const b = (n.text||'') + (n.by ? ' — ثبت‌کننده: '+n.by : '');
          show(t, b, k+':'+id);
          if(typeof toast==='function' && !document.hidden) toast(t+': '+(n.text||''));
        } else if(o.status !== n.status && n.status){
          const t = M.i+' تغییر وضعیت';
          show(t, (n.text||'')+' — '+(o.status||'—')+' ← '+n.status, k+':'+id+':s');
          if(typeof toast==='function' && !document.hidden) toast(t+': '+n.status);
        }
      });
    });
    prevSnap = now;
  }

  /* پس از هر به‌روزرسانی داده از ابر، تغییرات را بررسی کن */
  const _applyOrig = applyCloud;
  applyCloud = function(cloud){
    const r = _applyOrig.apply(this, arguments);
    try{ diffAndNotify(); }catch(e){ console.warn('notify', e); }
    return r;
  };

  /* مبنا: وضعیت داده‌ها بعد از ورود کاربر (تا رکوردهای قدیمی اعلان نشوند) */
  const iv = setInterval(() => {
    if(db && me){
      clearInterval(iv);
      prevSnap = snapshotOf(db);
      askPermissionBar();
    }
  }, 800);

  function askPermissionBar(){
    if(!('Notification' in window) || Notification.permission!=='default') return;
    const bar = document.createElement('div');
    bar.style.cssText='position:fixed;top:10px;left:10px;right:10px;z-index:400;background:#0f172a;color:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25)';
    bar.innerHTML = '<span>🔔 برای دریافت اعلان‌های برنامه اجازه دهید</span>';
    const b = document.createElement('button');
    b.className='btn pri sm'; b.textContent='فعال‌سازی';
    b.onclick = async () => {
      try{ await Notification.requestPermission(); }catch(e){}
      bar.remove();
      const reg = swReady ? await swReady : null;
      if(!reg) toast('⚠️ فایل sw.js کنار index.html پیدا نشد؛ آن را هم در همان پوشه آپلود کنید');
      else if(Notification.permission==='granted') toast('✅ اعلان‌ها فعال شد');
    };
    bar.appendChild(b);
    document.body.appendChild(bar);
  }
})();
</script>

</script>
<script>
/* یک‌بار: بازرسی‌های قدیمی که کد تجهیز فقط در توضیحات بودند، به فیلد eqId وصل می‌شوند */
(function(){
  const FLAG='hse_mig_eqid_v1';
  function run(){
    try{
      if(localStorage.getItem(FLAG)) return;
      if(!me || me.role!=='manager') return;
      let n=0;
      (db.inspections||[]).forEach(function(i){
        if(i.eqId) return;
        const id=emgEqIdOfInsp(i);
        if(id && (db.emgEquip||[]).some(function(x){return x.id===id})){ i.eqId=id; queueRec('inspections', i.id); n++; }
      });
      if(n) save({immediate:true});
      localStorage.setItem(FLAG,'1');
      if(n && typeof toast==='function') toast('✔ '+nd(n)+' بازرسی قدیمی به تجهیز خود وصل شد');
    }catch(e){ console.warn('اتصال بازرسی‌های قدیمی:', e); }
  }
  const iv=setInterval(function(){ if(db && db.inspections && me){ clearInterval(iv); run(); } },1000);
})();
</script>
</body>
</html>
