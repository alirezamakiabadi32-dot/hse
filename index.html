    h += '<p style="font-size:9pt;color:#64748b">⭐ = قلم بحرانی؛ مغایرت در این اقلام نتیجه را «ناقص» می‌کند.</p>';

  if(st.fail){

/* ---------- گزارش تجمیعی (سال جاری) ---------- */
function exportInspectionsSummary(format){
  const yr = todayJ().slice(0,4);
  const all = db.inspections || [];
  const recs = all.filter(r=>String(r.date||'').slice(0,4)===yr);
  const od = inspOverdue();

  let h = '<style>tr{page-break-inside:avoid}thead{display:table-header-group}</style>';
  h += '<h1>📊 گزارش تجمیعی چک‌لیست‌ها — سال '+nd(yr)+'</h1>';
  h += '<p>تاریخ تهیه: '+nd(todayJ())+' — تهیه‌کننده: '+esc(me.name)+' — بازرسی‌های امسال: <b>'+nd(recs.length)+'</b></p>';

  // ۱. خلاصه هر چک‌لیست + وضعیت سررسید
  h += '<h2>۱. خلاصه هر چک‌لیست (بازرسی‌های سال جاری)</h2>';
  h += '<table><thead><tr><th>چک‌لیست</th><th>دوره</th><th>تعداد بازرسی</th><th>میانگین امتیاز</th><th>کمترین امتیاز</th><th>آخرین بازرسی</th><th>وضعیت سررسید</th></tr></thead><tbody>';
  Object.keys(TPLS).forEach(tk=>{
    const t = TPLS[tk];
    const mine = recs.filter(r=>r.tpl===tk);
    const scores = mine.map(r=>inspStats(r).score);
    const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : null;
    const min = scores.length ? Math.min(...scores) : null;
    const last = mine.map(r=>r.date).sort().pop() || '—';
    const row = od.find(x=>x.tk===tk);
    let status;
    if(!row || row.never) status = '<span style="color:#dc2626">هنوز بازرسی ثبت نشده</span>';
    else if(row.late>0) status = '<span style="color:#dc2626;font-weight:700">⚠️ '+nd(row.late)+' روز تأخیر (سررسید: '+nd(row.due)+')</span>';
    else status = '<span style="color:#16a34a">به‌موقع — سررسید بعدی: '+nd(row.due)+'</span>';
    h += '<tr><td>'+esc(t.t)+'</td><td>هر '+nd(t.period)+' روز</td><td style="text-align:center">'+nd(mine.length)+'</td>'
       + '<td style="text-align:center">'+(avg===null?'—':nd(avg)+'٪')+'</td>'
       + '<td style="text-align:center">'+(min===null?'—':nd(min)+'٪')+'</td>'
       + '<td>'+nd(last)+'</td><td>'+status+'</td></tr>';
  });
  h += '</tbody></table>';

  // ۲. اقلامی که بیشتر شکست خورده‌اند
  const failCount = {};
  recs.forEach(r=>{
    const st = inspStats(r);
    st.items.forEach((t,i)=>{
      if(st.ans[i]==='fail'){
        const key = inspItemText(t);
        failCount[key] = (failCount[key]||0) + 1;
      }
    });
  });
  const top = Object.keys(failCount).map(k=>({k, n:failCount[k]})).sort((a,b)=>b.n-a.n).slice(0,10);
  h += '<h2>۲. کنترل‌هایی که بیشتر مغایرت داشته‌اند</h2>';
  if(!top.length) h += '<p>در این سال مغایرتی ثبت نشده است.</p>';
  else {
    h += '<table><thead><tr><th style="width:7%">ردیف</th><th>مورد بازرسی</th><th style="width:15%">تعداد مغایرت</th></tr></thead><tbody>';
    top.forEach((x,i)=>{ h += '<tr><td style="text-align:center">'+nd(i+1)+'</td><td>'+esc(x.k)+'</td><td style="text-align:center">'+nd(x.n)+'</td></tr>'; });
    h += '</tbody></table>';
  }

  // ۳. روند ماهانه امتیاز
  const byMonth = {};
  recs.forEach(r=>{
    const mk = String(r.date||'').slice(0,7);
    if(!mk) return;
    (byMonth[mk] = byMonth[mk] || []).push(inspStats(r).score);
  });
  const months = Object.keys(byMonth).sort();
  h += '<h2>۳. روند ماهانه امتیاز انطباق</h2>';
  if(!months.length) h += '<p>داده‌ای برای نمایش روند وجود ندارد.</p>';
  else {
    h += '<table><thead><tr><th style="width:18%">ماه</th><th style="width:12%">تعداد</th><th style="width:12%">میانگین</th><th>نمودار</th></tr></thead><tbody>';
    months.forEach(mk=>{
      const arr = byMonth[mk];
      const avg = Math.round(arr.reduce((a,b)=>a+b,0)/arr.length);
      const barColor = avg>=90 ? '#16a34a' : avg>=70 ? '#d97706' : '#dc2626';
      h += '<tr><td>'+nd(mk)+'</td><td style="text-align:center">'+nd(arr.length)+'</td><td style="text-align:center">'+nd(avg)+'٪</td>'
         + '<td><div style="background:#f1f5f9;border-radius:6px;height:12px;width:100%"><div style="background:'+barColor+';height:12px;border-radius:6px;width:'+avg+'%"></div></div></td></tr>';
    });
    h += '</tbody></table>';
  }

  // ۴. بازرسی‌های عقب‌افتاده
  h += '<h2>۴. بازرسی‌های عقب‌افتاده و سررسیدها (بر اساس آخرین بازرسی در همه سال‌ها)</h2>';
  h += '<table><thead><tr><th>چک‌لیست</th><th>آخرین بازرسی</th><th>سررسید بعدی</th><th>وضعیت</th></tr></thead><tbody>';
  od.forEach(x=>{
    const st = x.never ? '<span style="color:#dc2626">هرگز بازرسی نشده</span>'
      : x.late>0 ? '<span style="color:#dc2626;font-weight:700">عقب‌افتاده — '+nd(x.late)+' روز</span>'
      : '<span style="color:#16a34a">به‌موقع</span>';
    h += '<tr><td>'+esc(x.title)+'</td><td>'+(x.last?nd(x.last):'—')+'</td><td>'+(x.due?nd(x.due):'—')+'</td><td>'+st+'</td></tr>';
  });
  h += '</tbody></table>';

  const fn = 'HSE-checklist-summary-'+yr+'-'+todayJ().replace(/\//g,'-');
  if(format==='word') exportWord(h, fn); else exportPDF(h, fn);
}

/* ---------- خروجی Excel (CSV با BOM برای نمایش درست فارسی) ---------- */
function csvCell(v){ return '"' + String(v==null?'':v).replace(/"/g,'""') + '"'; }
function exportInspectionsCSV(){
  const recs = (db.inspections || []).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  if(!recs.length){ toast('بازرسی ثبت‌شده‌ای وجود ندارد'); return; }
  const RES = {ok:'مناسب', fail:'مغایرت', na:'نامرتبط'};
  const head = ['کد بازرسی','تاریخ','بازرس','نوع چک‌لیست','ردیف','مورد بازرسی','نتیجه','بحرانی','امتیاز بازرسی','توضیحات'];
  const lines = [head.map(csvCell).join(',')];
  recs.forEach(r=>{
    const st = inspStats(r);
    st.items.forEach((t,i)=>{
      lines.push([
        r.id, r.date, r.inspBy, inspTitleOf(r), i+1, inspItemText(t),
        RES[st.ans[i]] || 'بدون پاسخ', inspIsCritical(t) ? 'بله' : 'خیر', st.score, r.note || ''
      ].map(csvCell).join(','));
    });
  });
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  saveBlob(blob, 'HSE-inspections-' + todayJ().replace(/\//g,'-') + '.csv', 'text/csv');
}

/* ---------- ایجاد CAPA از یک مغایرت ---------- */
function capaFromInspection(id, i){
  const r = (db.inspections || []).find(x=>x.id===id);
  if(!r) return;
  const st = inspStats(r);
  const item = st.items[i] || '';
  closeModal();
  openForm('actions', null, {
    src:'بازرسی', ref:r.id, type:'اصلاحی (Corrective)', prio:'بالا',
    startD: todayJ(),
    desc:'رفع مغایرت در '+inspTitleOf(r)+': '+inspItemText(item)
  });
}

/* ============================================================
   یادآور پشتیبان‌گیری دوره‌ای
============================================================ */
(function(){
  const KEY = 'hse_last_backup';
  const WARN_AFTER_DAYS = 7;
  const SESSION_FLAG = 'hse_bk_warned';
  function daysSinceBackup(){
    try{
      const t = Number(localStorage.getItem(KEY) || 0);
      if(!t) return Infinity;
      return (Date.now() - t) / 86400000;
    }catch(e){ return 0; }
  }
  function maybeRemind(){
    try{
      if(sessionStorage.getItem(SESSION_FLAG)) return;
      if(typeof me === 'undefined' || !me) return;
      const d = daysSinceBackup();
      if(d < WARN_AFTER_DAYS) return;
      sessionStorage.setItem(SESSION_FLAG, '1');
      const msg = d === Infinity
        ? 'هنوز هیچ پشتیبانی تهیه نشده است. از منوی تنظیمات یک پشتیبان بگیرید.'
        : 'بیش از ' + Math.floor(d) + ' روز از آخرین پشتیبان می‌گذرد. لطفاً یک پشتیبان تازه بگیرید.';
      if(typeof toast === 'function') toast('💾 ' + msg);
    }catch(e){ console.warn('یادآور پشتیبان:', e); }
  }
  window.addEventListener('load', function(){ setTimeout(maybeRemind, 4000); });
})();

/* ============================================================
   برچسب‌گذاری یک‌باره اقلام بحرانی پیش‌فرض (فقط توسط مدیر و فقط یک بار روی هر دستگاه)
   اقلامی که کلیدواژه‌هایشان در فهرست زیر است و هنوز برچسب ندارند، [بحرانی] می‌گیرند.
============================================================ */
(function(){
  const FLAG = 'hse_crit_v1';
  const CRIT_KEYWORDS = [
    'عدم نشتی آب خنک','خشک بودن محوطه','عملکرد صحیح سیستم سوخت','دسترسی آزاد به کلید اضطراری',
    'لیمیت','سالم بودن سیم','ترمزهای بالا','سالم بودن قلاب',
    'ترمز سرویس','عدم نشتی گاز LPG','ROPS',
    'وجود کپسول در محل',
    'سالم بودن حفاظ','باز بودن خروجی','استفاده صحیح PPE',
    'ماسک تنفسی'
  ];
  function run(){
    try{
      if(localStorage.getItem(FLAG)) return;
      if(!me || me.role!=='manager' || typeof TPLS==='undefined' || !TPLS || typeof queueModule!=='function') return;
      let changed = 0;
      Object.keys(TPLS).forEach(tk=>{
        const t = TPLS[tk];
        if(!t || !Array.isArray(t.items)) return;
        t.items = t.items.map(it=>{
          if(inspIsCritical(it)) return it;
          const txt = String(it);
          if(CRIT_KEYWORDS.some(k=>txt.indexOf(k)>=0)){ changed++; return txt + ' ' + INSP_CRIT_TAG; }
          return it;
        });
      });
      if(changed){ db.tpls = TPLS; queueModule('tpls'); save({immediate:true}); }
      localStorage.setItem(FLAG, '1');
      if(changed && typeof toast==='function') toast('✔ '+changed+' قلم بحرانی پیش‌فرض برچسب‌گذاری شد');
    }catch(e){ console.warn('برچسب‌گذاری اقلام بحرانی:', e); }
  }
  window.addEventListener('load', function(){ setTimeout(run, 6000); });
})();


/* ============================================================
   گزارش عملکرد شخصی با انتخاب بازه‌ی تاریخ
   فقط رکوردهای مرتبط با حساب کاربر فعلی را نشان می‌دهد
============================================================ */
(function(){
  var KEY='myReport';
  var _origCanView=canView;
  canView=function(k){ if(k===KEY) return !!me; return _origCanView(k); };
  SPECIAL[KEY]={t:'گزارش عملکرد من',i:'📑',ren:myReportPage};
  NAV.push({g:'گزارش شخصی',items:[KEY]});

  var AR={'۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9','٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
  function normDate(s){
    var x=String(s==null?'':s).replace(/[۰-۹٠-٩]/g,function(c){return AR[c]}).trim().replace(/-/g,'/');
    var m=x.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
    if(!m) return '';
    return m[1]+'/'+('0'+m[2]).slice(-2)+'/'+('0'+m[3]).slice(-2);
  }
  function recDate(r){ return normDate(r.date||r.startD||r.createdJ||''); }
  function inR(r,f,t){ var d=recDate(r); return !!d && d>=f && d<=t; }
  function listHas(a,n){ return Array.isArray(a) && a.indexOf(n)>=0; }
  function arr(k){ return (db && db[k]) || []; }
  function sumOf(a,key){ return a.reduce(function(s,r){return s+(Number(r[key])||0)},0); }
  var CLOSED=['تایید و بسته شد','رد شده'];

  function buildData(f,t){
    var n=me.name, D={}, today=todayJ();
    D.incRep=arr('incidents').filter(function(r){return r.createdBy===n && inR(r,f,t)});
    D.incNear=D.incRep.filter(function(r){return String(r.type||'').indexOf('شبه')>=0});
    D.incInj=arr('incidents').filter(function(r){return r.injured===n && inR(r,f,t)});
    D.uns=arr('unsafe').filter(function(r){return (r.observer===n||r.createdBy===n) && inR(r,f,t)});
    D.acts=arr('actions').filter(function(r){return r.owner===n && inR(r,f,t)});
    D.actOpen=D.acts.filter(function(r){return CLOSED.indexOf(r.status)<0});
    D.actLate=D.actOpen.filter(function(r){var d=normDate(r.due);return !!d && d<today});
    D.actDone=D.acts.filter(function(r){return r.status==='تایید و بسته شد'});
    D.insp=arr('inspections').filter(function(r){return r.inspBy===n && inR(r,f,t)});
    D.risks=arr('risks').filter(function(r){return r.owner===n && inR(r,f,t)});
    D.trn=arr('trainings').filter(function(r){return listHas(r.people,n) && inR(r,f,t)});
    D.trnH=sumOf(D.trn,'dur');
    D.tbm=arr('tbm').filter(function(r){return listHas(r.people,n) && inR(r,f,t)});
    D.tbt=arr('toolbox').filter(function(r){return listHas(r.people,n) && inR(r,f,t)});
    D.bbs=arr('bbs').filter(function(r){return r.person===n && inR(r,f,t)});
    D.bbsSafe=sumOf(D.bbs,'safe');
    D.bbsUnsafe=sumOf(D.bbs,'unsafe');
    D.ppe=arr('ppeTx').filter(function(r){return r.person===n && inR(r,f,t)});
    D.ptw=arr('ptw').filter(function(r){return listHas(r.workers,n) && inR(r,f,t)});
    return D;
  }

  function row(l,v){
    return '<tr><td>'+esc(l)+'</td><td style="text-align:right;font-weight:700">'+v+'</td></tr>';
  }

  function reportBody(f,t){
    var D=buildData(f,t);
    var any=[D.incRep,D.incInj,D.uns,D.acts,D.insp,D.risks,D.trn,D.tbm,D.tbt,D.bbs,D.ppe,D.ptw].some(function(a){return a.length});
    var h='<p style="font-size:12.5px;color:var(--mut);margin-bottom:10px">بازه گزارش: <b>'+nd(f)+'</b> تا <b>'+nd(t)+'</b></p>';
    if(!any){
      return h+'<div style="text-align:center;color:var(--mut);padding:24px">در این بازه هیچ فعالیتی برای شما ثبت نشده است.</div>';
    }
    h+='<div class="tscroll"><table class="tbl"><thead><tr><th>شاخص</th><th>مقدار</th></tr></thead><tbody>';
    h+=row('حادثه و شبه‌حادثه‌ای که ثبت کرده‌اید', nd(D.incRep.length)+' (شبه‌حادثه: '+nd(D.incNear.length)+')');
    h+=row('حادثه‌ای که در آن مصدوم بوده‌اید', nd(D.incInj.length));
    h+=row('آنومالی‌های ثبت‌شده توسط شما', nd(D.uns.length));
    h+=row('اقدامات اصلاحی (مسئول)', nd(D.acts.length)+' — باز: '+nd(D.actOpen.length)+' — معوق: '+nd(D.actLate.length)+' — بسته‌شده: '+nd(D.actDone.length));
    h+=row('بازرسی‌های انجام‌شده', nd(D.insp.length));
    h+=row('ریسک‌های تحت مسئولیت', nd(D.risks.length));
    h+=row('دوره‌های آموزشی (حضور)', nd(D.trn.length)+' دوره — '+nd(D.trnH)+' ساعت');
    h+=row('جلسات TBM (حضور)', nd(D.tbm.length));
    h+=row('جلسات TBT (حضور)', nd(D.tbt.length));
    h+=row('مشاهدات رفتاری BBS', nd(D.bbs.length)+' — ایمن: '+nd(D.bbsSafe)+' — ناایمن: '+nd(D.bbsUnsafe));
    h+=row('تجهیزات PPE تحویل‌شده', nd(D.ppe.length));
    h+=row('مجوز کار (PTW) با نام شما', nd(D.ptw.length));
    h+='</tbody></table></div>';

    var items=[];
    D.incRep.forEach(function(r){items.push({d:recDate(r),k:'حادثه / شبه‌حادثه',x:r.title||r.type||'',s:r.status||''})});
    D.incInj.forEach(function(r){items.push({d:recDate(r),k:'حادثه (مصدوم)',x:r.title||'',s:r.status||''})});
    D.uns.forEach(function(r){items.push({d:recDate(r),k:'آنومالی',x:r.desc||'',s:r.status||''})});
    D.acts.forEach(function(r){items.push({d:recDate(r),k:'اقدام اصلاحی',x:(r.code?'['+r.code+'] ':'')+(r.desc||''),s:r.status||''})});
    D.trn.forEach(function(r){items.push({d:recDate(r),k:'آموزش',x:r.course||'',s:'حاضر'})});
    if(items.length){
      items.sort(function(a,b){return String(b.d).localeCompare(String(a.d))});
      h+='<div class="msh" style="margin-top:16px">📋 ریز رکوردها</div>';
      h+='<div class="tscroll"><table class="tbl"><thead><tr><th>تاریخ</th><th>نوع</th><th>شرح</th><th>وضعیت</th></tr></thead><tbody>';
      items.forEach(function(it){
        h+='<tr><td>'+nd(it.d)+'</td><td>'+esc(it.k)+'</td><td>'+esc(it.x)+'</td><td>'+esc(it.s)+'</td></tr>';
      });
      h+='</tbody></table></div>';
    }
    return h;
  }

  var PERIODS=[['day','روزانه'],['week','هفتگی'],['month','ماهانه'],['quarter','سه‌ماهه'],['year','سالانه'],['custom','دلخواه']];
  function fmtJ(y,m,d){ return y+'/'+p2(m)+'/'+p2(d); }
  function dayAdd(s,n){
    var g=jParse(s); if(!g) return '';
    var d=new Date(g.gy,g.gm-1,g.gd+n);
    var j=g2j(d.getFullYear(),d.getMonth()+1,d.getDate());
    return fmtJ(j.jy,j.jm,j.jd);
  }
  function diffDays(a,b){
    var ga=jParse(a), gb=jParse(b); if(!ga||!gb) return 0;
    return Math.round((new Date(gb.gy,gb.gm-1,gb.gd)-new Date(ga.gy,ga.gm-1,ga.gd))/86400000);
  }
  // بازه‌ی کامل دوره‌ای که تاریخ «a» در آن قرار دارد
  function periodRange(p,a){
    var x=a.split('/').map(Number), jy=x[0], jm=x[1];
    if(p==='day') return [a,a];
    if(p==='week'){
      var g=jParse(a), dow=new Date(g.gy,g.gm-1,g.gd).getDay();
      var start=dayAdd(a,-((dow+1)%7));
      return [start,dayAdd(start,6)];
    }
    if(p==='month'){ var s1=fmtJ(jy,jm,1); return [s1,dayAdd(jAddM(s1,1),-1)]; }
    if(p==='quarter'){ var qm=Math.floor((jm-1)/3)*3+1, s2=fmtJ(jy,qm,1); return [s2,dayAdd(jAddM(s2,3),-1)]; }
    if(p==='year'){ var s3=fmtJ(jy,1,1); return [s3,dayAdd(jAddM(s3,12),-1)]; }
    return null;
  }
  function shiftRange(p,f,t,n){
    if(p==='custom'){
      var span=diffDays(f,t)+1;
      return [dayAdd(f,n*span),dayAdd(t,n*span)];
    }
    var anchor;
    if(p==='day') anchor=dayAdd(f,n);
    else if(p==='week') anchor=dayAdd(f,7*n);
    else if(p==='month') anchor=jAddM(f,n);
    else if(p==='quarter') anchor=jAddM(f,3*n);
    else anchor=jAddM(f,12*n);
    return periodRange(p,anchor);
  }

  function myReportPage(){
    if(!me) return '';
    var r=periodRange('month',todayJ());
    var opts=PERIODS.map(function(o){return '<option value="'+o[0]+'"'+(o[0]==='month'?' selected':'')+'>'+o[1]+'</option>'}).join('');
    return '<div class="card"><div class="sechead">📑 گزارش عملکرد من — '+esc(me.name)+'</div>'
      +'<div class="toolbar" style="align-items:flex-end">'
      +'<div><div style="font-size:12px;color:var(--mut);margin-bottom:4px">دوره</div><select id="mr_period" class="in sm" onchange="myReportPeriod(this.value)">'+opts+'</select></div>'
      +'<div><div style="font-size:12px;color:var(--mut);margin-bottom:4px">&nbsp;</div><button class="btn ghost sm" onclick="myReportShift(-1)">▶ قبلی</button> <button class="btn ghost sm" onclick="myReportShift(1)">بعدی ◀</button></div>'
      +'<div><div style="font-size:12px;color:var(--mut);margin-bottom:4px">از تاریخ</div><input id="mr_from" class="in sm" value="'+r[0]+'" placeholder="1404/01/01" oninput="myReportManual()" style="direction:ltr;text-align:center"></div>'
      +'<div><div style="font-size:12px;color:var(--mut);margin-bottom:4px">تا تاریخ</div><input id="mr_to" class="in sm" value="'+r[1]+'" placeholder="1404/01/31" oninput="myReportManual()" style="direction:ltr;text-align:center"></div>'
      +'<button class="btn pri sm" onclick="myReportRun()">🔍 نمایش</button>'
      +'<button class="btn ghost sm" onclick="myReportRun(\'word\')">📄 Word</button>'
      +'<button class="btn ghost sm" onclick="myReportRun(\'pdf\')">🖨️ PDF</button>'
      +'</div>'
      +'<div style="font-size:12px;color:var(--mut);margin-bottom:10px">دوره را انتخاب کنید؛ تاریخ‌ها خودکار تنظیم می‌شوند. برای بازه دلخواه، تاریخ‌ها را به صورت 1404/01/01 وارد کنید.</div>'
      +'<div id="mr_out">'+reportBody(r[0],r[1])+'</div></div>';
  }

  function readRange(){
    var f=normDate($('#mr_from').value), t=normDate($('#mr_to').value);
    if(!f||!t){ toast('تاریخ‌ها را به صورت 1404/01/01 وارد کنید'); return null; }
    if(f>t){ var x=f; f=t; t=x; }
    return [f,t];
  }
  function setInputs(f,t){ $('#mr_from').value=f; $('#mr_to').value=t; }

  window.myReportPeriod=function(p){
    if(p==='custom') return;
    var r=periodRange(p,todayJ());
    if(r) setInputs(r[0],r[1]);
    myReportRun();
  };
  window.myReportShift=function(n){
    var rg=readRange(); if(!rg) return;
    var p=$('#mr_period').value;
    var r=shiftRange(p,rg[0],rg[1],n);
    if(r&&r[0]&&r[1]){ setInputs(r[0],r[1]); myReportRun(); }
  };
  window.myReportManual=function(){
    var s=$('#mr_period'); if(s && s.value!=='custom') s.value='custom';
  };
  function exportMyReport(fmt,f,t){
    var h='<h1>📑 گزارش عملکرد — '+esc(me.name)+'</h1>'
      +'<p>تاریخ تهیه: '+nd(todayJ())+'</p>'+reportBody(f,t);
    var fn='HSE-My-Report-'+f.replace(/\//g,'-')+'_to_'+t.replace(/\//g,'-');
    if(fmt==='word') exportWord(h,fn); else exportPDF(h,fn);
  }

  window.myReportRun=function(mode){
    var rg=readRange(); if(!rg) return;
    if(mode==='word'||mode==='pdf'){ exportMyReport(mode,rg[0],rg[1]); return; }
    $('#mr_out').innerHTML=reportBody(rg[0],rg[1]);
  };
})();

</script>
